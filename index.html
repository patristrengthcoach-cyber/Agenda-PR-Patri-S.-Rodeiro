<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda · Patri S. Rodeiro Strength & Rehab</title>
<meta name="theme-color" content="#0D3B4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface-2:#F8FAFB;--ink:#0F2230;--ink-2:#34495A;--muted:#6B7C89;--line:#E2E7EB;--line-2:#EDF1F4;
  --brand:#0D3B4C;--brand-2:#145A6E;--accent:#1B998B;--accent-ink:#FFFFFF;--accent-soft:#E3F4F1;
  --blue-soft:#E8F0F6;--blue:#2A5D84;
  --amber:#96610B;--amber-soft:#FDF2DE;--red:#B03A33;--red-soft:#FBE7E5;--green:#1F7A4A;--green-soft:#E2F3E9;--wa:#1E8E4E;
  --shadow:0 1px 2px rgba(15,34,48,.06),0 8px 24px rgba(15,34,48,.06);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C161D;--surface:#122029;--surface-2:#0F1B23;--ink:#E6EDF1;--ink-2:#C0CDD5;--muted:#8A9BA7;--line:#223441;--line-2:#1A2A35;
  --brand:#0A2E3B;--brand-2:#1E6F85;--accent:#3CC2B2;--accent-ink:#06201C;--accent-soft:#14352F;
  --blue-soft:#172E40;--blue:#8AB8DB;
  --amber:#E8B25A;--amber-soft:#3A2D14;--red:#EE8A80;--red-soft:#3C1E1B;--green:#6FCB94;--green-soft:#173524;--wa:#3DBB6F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0C161D;--surface:#122029;--surface-2:#0F1B23;--ink:#E6EDF1;--ink-2:#C0CDD5;--muted:#8A9BA7;--line:#223441;--line-2:#1A2A35;
  --brand:#0A2E3B;--brand-2:#1E6F85;--accent:#3CC2B2;--accent-ink:#06201C;--accent-soft:#14352F;
  --blue-soft:#172E40;--blue:#8AB8DB;
  --amber:#E8B25A;--amber-soft:#3A2D14;--red:#EE8A80;--red-soft:#3C1E1B;--green:#6FCB94;--green-soft:#173524;--wa:#3DBB6F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Shell */
.app{display:flex;min-height:100vh}
.side{display:none}
.content{flex:1;min-width:0}
.mtop{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--brand);color:#fff}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--accent),#127A70);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;color:#fff;flex-shrink:0}
.bname{font-weight:800;font-size:16px;line-height:1.15}
.bname small{display:block;font-weight:500;font-size:12.5px;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:22px 18px 110px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.phead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.phead p{margin:3px 0 0;color:var(--muted);font-size:14px}
.pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg.i{width:21px;height:21px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;width:248px;flex-shrink:0;background:var(--brand);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}
  .side .brandbox{display:flex;align-items:center;gap:11px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
  .side nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:9px;font-weight:600;font-size:14.5px;text-align:left;margin-bottom:2px}
  .side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  .side .foot{margin-top:auto;font-size:12.5px;color:rgba(255,255,255,.6);padding:0 8px;display:flex;align-items:center;gap:7px}
  .mtop,nav.tabs{display:none}
  main{padding:30px 32px 40px}
}
.logout{background:none;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;margin-top:10px}
.logout:hover{background:rgba(255,255,255,.08)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--brand)}
.login .box{background:var(--surface);border-radius:18px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login .box .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login .box .bname small{color:var(--muted);opacity:1}
.login .err{color:var(--red);font-size:13.5px;font-weight:600;min-height:20px;margin:-4px 0 10px}
.login .lnk{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:10px 0 0}
.quien{color:#fff;font-weight:700;font-size:13px;margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.off{background:var(--amber)}

/* Panels */
.grid2{display:grid;gap:16px}
@media (min-width:960px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.grid2 .panel{margin-bottom:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.ph h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ph .hint{font-size:12.5px;color:var(--muted)}
.count{font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:20px;padding:1px 8px}
.count.hot{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.pb{padding:6px 0}
.pbpad{padding:16px 18px}
.empty{color:var(--muted);font-size:14px;padding:18px;display:flex;align-items:center;gap:10px}
.empty svg.i{color:var(--green)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px 18px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
.kpi .bar{height:5px;border-radius:3px;background:var(--line-2);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* Rows */
.item{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .time{font-weight:800;font-size:15px;width:48px;flex-shrink:0}
.item .time small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.item .who{flex:1;min-width:0}
.item .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .who span{font-size:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.item.wrap{flex-wrap:wrap}.item.wrap .acts{width:100%;justify-content:flex-start;padding-left:62px}}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn svg.i{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--red);border-color:transparent;background:none}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px 9px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;margin-right:4px;white-space:nowrap}
.pill.prog{background:var(--blue-soft);color:var(--blue)}
.pill.hecha{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.paid{background:transparent;color:var(--green);border:1px solid currentColor}
.pill.unpaid{background:var(--amber-soft);color:var(--amber)}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;margin-bottom:16px}

/* Week: calendario */
.cal-wrap{overflow-x:auto}
.tg{display:grid;position:relative}
.wk-desk .tg{min-width:780px}
.tgh{padding:12px 10px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line-2);grid-row:1}
.tgh.corner{grid-column:1;border-left:0}
.tgh b{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.tgh span{font-size:20px;font-weight:800}
.tgh em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.tgh.today span{color:var(--accent)}
.tgh .w{display:block;font-size:11.5px;color:var(--amber);font-weight:700;margin-left:0}
.tgl{grid-column:1;font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;padding:2px 9px 0 0;border-top:1px solid var(--line)}
.q{border:0;border-left:1px solid var(--line-2);background:transparent;padding:0 0 0 8px;margin:0;text-align:left;font-size:11.5px;font-weight:700;color:transparent;display:flex;align-items:center;min-width:0}
.q.hr{border-top:1px solid var(--line)}
.q.half{border-top:1px dashed var(--line-2)}
.q.today{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
button.q:hover,button.q:focus-visible{background:var(--accent-soft);color:var(--accent);outline-offset:-2px}
.closed{border-left:1px solid var(--line-2);border-top:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px);display:flex;justify-content:center;padding-top:12px;font-size:12px;font-weight:600;color:var(--muted)}
.chip{z-index:2;margin:2px 4px 2px 5px;border:0;text-align:left;border-radius:8px;padding:5px 8px 5px 11px;background:var(--blue-soft);color:var(--ink);position:relative;font-size:12.5px;line-height:1.3;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(15,34,48,.08)}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.chip b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--muted);font-size:11.5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip:hover{filter:brightness(.97)}
.chip.hecha{background:var(--green-soft)}.chip.hecha::before{background:var(--green)}
.chip.noshow,.chip.tarde{background:var(--red-soft)}.chip.noshow::before,.chip.tarde::before{background:var(--red)}
.chip.unsent{outline:1.5px dashed var(--amber);outline-offset:-1.5px}
.chip.cancelada{justify-self:end;width:40px;background:var(--surface-2);border:1px dashed var(--line);box-shadow:none;padding:5px;text-align:center;color:var(--muted)}
.chip.cancelada::before{display:none}
.chip.cancelada b{text-decoration:line-through;font-size:11px}
.mini{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.mini.unpaid{background:var(--amber)}.mini.paid{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--line-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.unsent-sw{border:1.5px dashed var(--amber)}

/* Week: mobile day view */
.wk-desk{display:none}
@media (min-width:960px){.wk-desk{display:block}.wk-mob{display:none}}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.days button{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 2px;text-align:center}
.days button b{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.days button span{display:block;font-size:19px;font-weight:800;line-height:1.2}
.days button em{font-style:normal;font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.days button[aria-pressed="true"] b,.days button[aria-pressed="true"] em{color:rgba(255,255,255,.75)}
.wknav{display:flex;align-items:center;gap:6px}
.wknav .lbl{font-weight:700;font-size:15px;min-width:150px;text-align:center}

/* Table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-2)}
th{font-weight:700;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
th:first-child,td:first-child{padding-left:18px}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 36px;background:var(--surface)}
.search svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Modal */
.back{position:fixed;inset:0;background:rgba(8,20,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media (min-width:700px){.back{align-items:center;padding:20px}.sheet{border-radius:18px}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 12px}
.sh h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.sh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sbody{padding:4px 22px 10px}
.sfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);background:var(--surface-2)}
.f{margin-bottom:14px}
.f label,.flabel{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.f input,.f select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface)}
.f input:focus,.f select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--green)}
.msgbox{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;white-space:pre-wrap;margin-bottom:12px}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msgs .card{border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.msgs .card b{display:block;font-size:13px;margin-bottom:7px}
.msgs .card .acts{justify-content:flex-start}
.hist .item{padding:8px 0}
.lastmod{font-size:12.5px;color:var(--muted);margin:4px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
@media (min-width:960px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style>
</head>
<body>
<div id="login" class="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brandbox"><div class="logo">PSR</div><div class="bname">Patri S. Rodeiro<small>Strength &amp; Rehab</small></div></div>
    <nav id="sidenav" aria-label="Secciones"></nav>
    <div class="foot"><div><div id="quien" class="quien" hidden></div><div style="display:flex;align-items:center;gap:7px"><span class="dot" id="syncdot"></span><span id="sync">Cargando…</span></div><button class="logout" data-logout="1">Cerrar sesión</button></div></div>
  </aside>
  <div class="content">
    <div class="mtop"><div class="logo">PSR</div><div class="bname" style="flex:1">Patri S. Rodeiro<small>Strength &amp; Rehab</small></div><button class="logout" data-logout="1">Salir</button></div>
    <main id="main"></main>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div id="modal"></div>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- Iconos ---------- */
const IC = {
  hoy:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  semana:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clientes:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.4-4.4-3.5-5.1"/>',
  mes:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
  wa:'<path d="M20.5 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.1-4.2A8.5 8.5 0 1 1 20.5 12z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>', down:'<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  up:'<path d="M12 16V5M7 10l5-5 5 5M4 20h16"/>', repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  send:'<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'
};
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- Constantes ---------- */
const CAPACIDAD = 20, DURACION = 45, MAX_SEGUIDAS = 4;
const LUGAR = "Clínica DCF", FIRMA = "Patri S. Rodeiro · Strength & Rehab";
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DABR = ["dom","lun","mar","mié","jue","vie","sáb"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ESTADOS = {
  programada:{t:"Programada", cobra:false, pill:"prog"},
  hecha:{t:"Hecha", cobra:true, pill:"hecha"},
  cancelada:{t:"Canceló a tiempo", cobra:false, pill:"off"},
  tarde:{t:"Canceló tarde", cobra:true, pill:"red"},
  noshow:{t:"No vino", cobra:true, pill:"red"}
};

/* ---------- Utilidades ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); return addDays(x,-((x.getDay()+6)%7)); };
const toMin = h => { const [a,b] = h.split(":").map(Number); return a*60+b; };
const fromMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const mkey = s => s.slice(0,7);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr = () => ymd(new Date());
const fechaLarga = s => { const d = parse(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const iniciales = n => n.trim().split(/\s+/).slice(0,2).map(p => p[0]).join("").toUpperCase();
const phoneIntl = p => { let d = String(p||"").replace(/\D/g,""); if (d.startsWith("00")) d = d.slice(2); if (d.length === 9) d = "34"+d; return d; };
const endMin = date => { const w = parse(date).getDay(); return w === 6 ? 13*60 : w === 0 ? 0 : 21*60; };
const slotsFor = date => { const o=[]; for (let m=540; m+DURACION<=endMin(date); m+=DURACION) o.push(m); return o; };
const timeOptions = date => { const o=[]; const e = endMin(date) || 21*60; for (let m=540; m+DURACION<=e; m+=15) o.push(fromMin(m)); return o; };

/* ---------- Estado y guardado ---------- */
let S = { clientes:{}, sesiones:{} };
let me = { id:null, name:"" }, copiaCompartida = null;
const ui = { tab:"hoy", week: mondayOf(new Date()), day: todayStr(), month: todayStr().slice(0,7), q:"" };
if (parse(ui.day).getDay() === 0) { ui.week = addDays(ui.week,7); ui.day = ymd(ui.week); }

const queues = {};
let sb = null;
const TABLAS = ["clientes","sesiones"];
function persist(col, id, removed){
  const key = col+"/"+id;
  queues[key] = (queues[key] || Promise.resolve()).then(async () => {
    const cur = S[col][id];
    const { error } = (removed || !cur) ? await sb.from(col).delete().eq("id", id) : await sb.from(col).upsert({ id, data:cur });
    if (error) { toast("No se ha podido guardar. Revisa la conexión y vuelve a intentarlo."); setSync("Error al guardar", false); }
  });
}
function put(col, obj){ obj = { ...obj, modPor: me.name || obj.modPor || null, modEn: new Date().toISOString() }; S[col][obj.id] = obj; render(); persist(col, obj.id); }
function patch(col, id, ch){ put(col, { ...S[col][id], ...ch }); }
function remove(col, id){ delete S[col][id]; render(); persist(col, id, true); }
function setSync(t, ok){ document.getElementById("sync").textContent = t; document.getElementById("syncdot").className = "dot" + (ok ? "" : " off"); }

async function cargarTodo(){
  const res = await Promise.all([...TABLAS, "ajustes"].map(t => sb.from(t).select("id,data")));
  const err = res.find(r => r.error);
  if (err) { setSync("Sin conexión con tus datos", false); toast("No se han podido cargar los datos."); return; }
  TABLAS.forEach((t,i) => { const o = {}; res[i].data.forEach(r => { o[r.id] = r.data; }); S[t] = o; });
  const copia = res[2].data.find(r => r.id === "copia"); copiaCompartida = copia ? copia.data : null;
  setSync("Sincronizado", true); render();
}
function escuchar(){
  const ch = sb.channel("agenda");
  [...TABLAS, "ajustes"].forEach(t => ch.on("postgres_changes", { event:"*", schema:"public", table:t }, p => {
    if (t === "ajustes") { if ((p.new && p.new.id) === "copia") copiaCompartida = p.new.data; render(); return; }
    if (p.eventType === "DELETE") delete S[t][p.old.id]; else S[t][p.new.id] = p.new.data;
    render();
  }));
  ch.subscribe(st => { if (st === "SUBSCRIBED") setSync("Sincronizado", true); else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") setSync("Sin actualización en directo", false); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cargarTodo(); });
}

/* ---------- Acceso ---------- */
function pantallaLogin(modo){
  document.getElementById("app").hidden = true;
  const L = document.getElementById("login"); L.hidden = false;
  const recuperar = modo === "nueva";
  L.innerHTML = `<form class="box" id="lf" novalidate>
    <div class="head"><div class="logo">PSR</div><div class="bname">Patri S. Rodeiro<small>Strength &amp; Rehab · Agenda</small></div></div>
    ${recuperar ? `<div class="f"><label for="lp">Nueva contraseña</label><input id="lp" type="password" autocomplete="new-password" minlength="8"></div>`
      : `<div class="f"><label for="le">Email</label><input id="le" type="email" autocomplete="username"></div>
         <div class="f"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div>`}
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn primary" style="width:100%;justify-content:center;padding:11px" type="submit">${recuperar ? "Guardar contraseña" : "Entrar"}</button>
    ${recuperar ? "" : `<button class="lnk" type="button" id="lolv">He olvidado mi contraseña</button>`}
  </form>`;
  const err = t => { document.getElementById("lerr").textContent = t; };
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault(); err("");
    if (recuperar) {
      const pw = document.getElementById("lp").value; if (pw.length < 8) return err("Usa al menos 8 caracteres.");
      const { error } = await sb.auth.updateUser({ password: pw }); if (error) return err("No se ha podido cambiar. Pide un enlace nuevo.");
      history.replaceState(null, "", location.pathname); return arrancar();
    }
    const email = document.getElementById("le").value.trim(), password = document.getElementById("lp").value;
    if (!email || !password) return err("Escribe tu email y tu contraseña.");
    let error;
    try { ({ error } = await sb.auth.signInWithPassword({ email, password })); }
    catch(x){ return err("No se puede conectar con Supabase. Revisa la URL de config.js."); }
    if (error) {
      const m = (error.message || "").toLowerCase();
      if (m.includes("invalid login")) return err("Email o contraseña incorrectos.");
      if (m.includes("not confirmed")) return err("Tu usuario no está confirmado. En Supabase, vuelve a crearlo marcando Auto Confirm User.");
      if (m.includes("api key") || m.includes("apikey") || error.status === 401) return err("La clave de config.js no es correcta. Vuelve a copiar la Publishable key.");
      if (m.includes("fetch") || m.includes("network") || !error.status) return err("No se puede conectar con Supabase. Revisa la URL de config.js.");
      return err("Error de Supabase: " + error.message);
    }
    arrancar();
  };
  const olv = document.getElementById("lolv");
  if (olv) olv.onclick = async () => {
    const email = document.getElementById("le").value.trim(); if (!email) return err("Escribe tu email y vuelve a pulsar.");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    err(error ? "No se ha podido enviar el email. Inténtalo más tarde." : "Te hemos enviado un email para cambiar la contraseña.");
  };
}
let arrancada = false;
async function arrancar(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return pantallaLogin();
  me = { id:user.id, name:(user.user_metadata && user.user_metadata.nombre) || "" };
  document.getElementById("login").hidden = true; document.getElementById("app").hidden = false;
  const quien = document.getElementById("quien"); quien.textContent = me.name || user.email; quien.hidden = false;
  renderNav(); render();
  await cargarTodo();
  if (!arrancada) { arrancada = true; escuchar(); }
  if (!me.name) pedirNombre();
}
function pedirNombre(){
  openModal("¿Cómo te llamas?", "Se usa para saber quién hace cada cambio en la agenda", `<div class="f"><label for="pn">Tu nombre</label><input id="pn" autocomplete="given-name"></div>`,
    `<span></span><button class="btn primary" id="pnok">Guardar</button>`);
  document.getElementById("pnok").onclick = async () => {
    const n = document.getElementById("pn").value.trim(); if (!n) return toast("Escribe tu nombre");
    await sb.auth.updateUser({ data:{ nombre:n } }); me.name = n; document.getElementById("quien").textContent = n; closeModal(); render();
  };
}
async function init(){
  if (!window.supabase || !window.CONFIG || !CONFIG.SUPABASE_URL || CONFIG.SUPABASE_URL.includes("PEGA")) {
    document.getElementById("login").hidden = false;
    document.getElementById("login").innerHTML = `<div class="box"><h3 style="margin-top:0">Falta configurar la app</h3><p>Rellena el archivo <b>config.js</b> con la URL y la clave de tu proyecto de Supabase. Tienes los pasos en LEEME.md.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") pantallaLogin("nueva"); });
  if (location.hash.includes("type=recovery")) return;
  arrancar();
}
document.addEventListener("click", async e => { if (!e.target.closest("[data-logout]")) return; await sb.auth.signOut(); location.reload(); });

/* ---------- Consultas ---------- */
const ses = () => Object.values(S.sesiones);
const cli = id => S.clientes[id] || { nombre:"Cliente borrado", telefono:"" };
const byTime = (a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora);
const byName = (a,b) => cli(a).nombre.localeCompare(cli(b).nombre,"es");
const activa = s => s.estado !== "cancelada";
const cobrable = s => ESTADOS[s.estado]?.cobra;
const delDia = f => ses().filter(s => s.fecha === f).sort(byTime);
function numEnMes(s){ const l = ses().filter(x => x.clienteId === s.clienteId && mkey(x.fecha) === mkey(s.fecha) && activa(x)).sort(byTime); return { n: l.findIndex(x => x.id === s.id)+1, total: l.length }; }
function maxSeguidas(f){ const l = delDia(f).filter(activa).map(s => toMin(s.hora)); let best = l.length?1:0, run = 1; for (let i=1;i<l.length;i++){ if (l[i]-l[i-1] <= DURACION){ run++; best = Math.max(best,run); } else run = 1; } return best; }
function siguienteLaborable(){ let d = addDays(new Date(),1); if (d.getDay() === 0) d = addDays(d,1); return ymd(d); }

/* ---------- Mensajes ---------- */
function msgReserva(s){
  const c = cli(s.clienteId), m = MESES[parse(s.fecha).getMonth()], {n} = numEnMes(s);
  return `Hola ${c.nombre.split(" ")[0]}! 👋 Te confirmo tu sesión:\n\n📅 ${cap(fechaLarga(s.fecha))} a las ${s.hora}\n📍 ${LUGAR}\n\nEs tu sesión nº ${n} de ${m}.\n\nSi no puedes venir, avísame con al menos 24 h de antelación. Si no avisas o no vienes, la sesión se cobra.\n\n${FIRMA}`;
}
function msgRecordatorio(s){
  const c = cli(s.clienteId), d = parse(s.fecha), manana = s.fecha === ymd(addDays(new Date(),1));
  const cuando = manana ? `mañana, ${DIAS[d.getDay()]} ${d.getDate()},` : `del ${DIAS[d.getDay()]} ${d.getDate()}`;
  const limite = manana ? `hoy antes de las ${s.hora}` : `antes del ${DIAS[addDays(d,-1).getDay()]} a las ${s.hora}`;
  return `Hola ${c.nombre.split(" ")[0]}! Te recuerdo tu sesión ${cuando} a las ${s.hora}.\n\nSi necesitas cancelar, avísame ${limite} y no se cobra.\n\n¡Nos vemos! 💪\nPatri`;
}
function msgSemana(cid, lunes){
  const c = cli(cid), ini = ymd(lunes), fin = ymd(addDays(lunes,6));
  const l = ses().filter(s => s.clienteId === cid && s.fecha >= ini && s.fecha <= fin && activa(s)).sort(byTime);
  if (!l.length) return "";
  const lineas = l.map(s => { const d = parse(s.fecha); return `• ${cap(DIAS[d.getDay()])} ${d.getDate()} · ${s.hora}`; }).join("\n");
  return `Hola ${c.nombre.split(" ")[0]}! 👋 Estas son tus sesiones de la semana:\n\n${lineas}\n\n📍 ${LUGAR}\n\nSi no puedes venir a alguna, avísame con al menos 24 h de antelación. Si no avisas o no vienes, la sesión se cobra.\n\n${FIRMA}`;
}
const waLink = (tel, t) => { const p = phoneIntl(tel); return `https://wa.me/${p}?text=${encodeURIComponent(t)}`; };
async function copiar(t){
  try { await navigator.clipboard.writeText(t); toast("Mensaje copiado"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Mensaje copiado"); } catch(_){ toast("No se ha podido copiar"); } ta.remove(); }
}
function enviar(tel, t, done){ window.open(waLink(tel,t), "_blank", "noopener"); if (done) done(); }

/* ---------- Navegación ---------- */
const TABS = [["hoy","Hoy"],["semana","Semana"],["clientes","Clientes"],["mes","Mes"]];
function renderNav(){
  const html = TABS.map(([k,l]) => `<button data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${ic(k)}<span>${l}</span></button>`).join("");
  document.getElementById("tabs").innerHTML = html; document.getElementById("sidenav").innerHTML = html;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; ui.tab = b.dataset.tab; renderNav(); render(); window.scrollTo(0,0); });

function render(){
  const main = document.getElementById("main"), y = window.scrollY;
  const focusId = document.activeElement && document.activeElement.id;
  main.innerHTML = ({ hoy:vHoy, semana:vSemana, clientes:vClientes, mes:vMes })[ui.tab]();
  if (focusId === "qsearch"){ const i = document.getElementById("qsearch"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  window.scrollTo(0,y);
}

/* ---------- Piezas ---------- */
function pills(s){
  let h = s.estado !== "programada" ? `<span class="pill ${ESTADOS[s.estado].pill}">${ESTADOS[s.estado].t}</span>` : "";
  if (cobrable(s) || s.pagado) h += s.pagado ? `<span class="pill paid">Pagado</span>` : `<span class="pill unpaid">Sin pagar</span>`;
  return h;
}
const panel = (title, count, body, hint, hot) => `<section class="panel"><div class="ph"><h2>${title}${count!==null?` <span class="count${hot&&count?" hot":""}">${count}</span>`:""}</h2>${hint?`<span class="hint">${hint}</span>`:""}</div><div class="pb">${body}</div></section>`;
const vacio = t => `<div class="empty">${ic("check")}${t}</div>`;

/* ---------- Vista: Hoy ---------- */
const saludo = () => { const x = new Date().getHours(); return x < 14 ? "Buenos días" : x < 21 ? "Buenas tardes" : "Buenas noches"; };
function vHoy(){
  const hoy = todayStr(), now = new Date(), nowMin = now.getHours()*60+now.getMinutes();
  const porMarcar = ses().filter(s => s.estado === "programada" && (s.fecha < hoy || (s.fecha === hoy && toMin(s.hora)+DURACION <= nowMin))).sort(byTime);
  const sig = siguienteLaborable(), recs = delDia(sig).filter(activa), deHoy = delDia(hoy);
  const sinReserva = ses().filter(s => s.estado === "programada" && s.fecha >= hoy && !s.reservaEnviada).sort(byTime);
  const deben = {}; ses().filter(s => cobrable(s) && !s.pagado).forEach(s => (deben[s.clienteId] ||= []).push(s));
  const lunes = mondayOf(new Date()), ini = ymd(lunes), fin = ymd(addDays(lunes,6));
  const semAct = ses().filter(s => s.fecha >= ini && s.fecha <= fin && activa(s)).length;
  const recPend = recs.filter(s => !s.recordatorioEnviado).length;
  const pendPago = Object.values(deben).reduce((a,l) => a+l.length, 0);

  let h = `<div class="phead"><div><h1>${saludo()}${me.name ? ", "+esc(me.name.split(" ")[0]) : ""}</h1><p>${cap(fechaLarga(hoy))}</p></div><div class="pactions"><button class="btn primary" data-new="${hoy}|">${ic("plus")}Nueva sesión</button></div></div>`;
  const dc = diasDesdeCopia();
  if (Object.keys(S.sesiones).length && (dc === null || dc >= 7)) h += `<div class="alert"><span>${dc === null ? "Aún no has guardado ninguna copia en tu ordenador." : `Tu última copia es de hace ${dc} días.`}</span><button class="btn small" data-backup="1">${ic("down")}Guardar copia</button></div>`;
  h += `<div class="kpis">
    <div class="kpi"><div class="v">${deHoy.filter(activa).length}</div><div class="l">Sesiones hoy</div></div>
    <div class="kpi"><div class="v">${semAct}<small> / ${CAPACIDAD}</small></div><div class="l">Esta semana</div><div class="bar"><i style="width:${Math.min(semAct/CAPACIDAD*100,100)}%"></i></div></div>
    <div class="kpi"><div class="v">${recPend}</div><div class="l">Recordatorios por enviar</div></div>
    <div class="kpi"><div class="v">${pendPago}</div><div class="l">Sesiones sin pagar</div></div></div>`;
  if (!Object.keys(S.clientes).length) h += `<section class="panel"><div class="empty">${ic("clientes")}Empieza dando de alta a tus clientes en Clientes. Después planifica la semana en Semana.</div></section>`;

  const itemSes = (s, acts, sub) => `<div class="item wrap"><div class="time">${s.hora}${sub?`<small>${sub}</small>`:""}</div><div class="who"><b>${esc(cli(s.clienteId).nombre)}</b><span>${pills(s)||'<span class="pill prog">Programada</span>'}</span></div><div class="acts">${acts}</div></div>`;

  if (porMarcar.length) h += panel("Marca cómo fueron", porMarcar.length, porMarcar.length ? porMarcar.map(s => itemSes(s,
      `<button class="btn small primary" data-estado="hecha" data-id="${s.id}">Hecha</button><button class="btn small" data-estado="noshow" data-id="${s.id}">No vino</button><button class="btn small" data-estado="tarde" data-id="${s.id}">Canc. tarde</button><button class="btn small" data-estado="cancelada" data-id="${s.id}">Canc. a tiempo</button>`,
      s.fecha === hoy ? "" : `${DABR[parse(s.fecha).getDay()]} ${parse(s.fecha).getDate()}`)).join("") : vacio("Todo al día."), null, true);
  h += `<div class="grid2">`;
  h += panel("Agenda de hoy", deHoy.length, deHoy.length ? deHoy.map(s => itemSes(s, `<button class="btn small" data-open="${s.id}">Abrir</button>`)).join("") : vacio("No tienes sesiones hoy."));
  h += panel(`Recordatorios · ${DIAS[parse(sig).getDay()]} ${parse(sig).getDate()}`, recPend, recs.length ? recs.map(s => itemSes(s,
      s.recordatorioEnviado ? `<span class="pill paid">Enviado</span><button class="btn small ghost" data-copy="rec" data-id="${s.id}">${ic("copy")}</button>` : `<button class="btn small wa" data-wa="rec" data-id="${s.id}">${ic("wa")}WhatsApp</button><button class="btn small icon" data-copy="rec" data-id="${s.id}" aria-label="Copiar">${ic("copy")}</button>`)).join("") : vacio("No hay sesiones ese día."), "Envíalos hoy", true);
  h += `</div><div style="height:16px"></div><div class="grid2">`;
  h += panel("Reservas sin enviar", sinReserva.length, sinReserva.length ? sinReserva.map(s => itemSes(s,
      `<button class="btn small wa" data-wa="res" data-id="${s.id}">${ic("wa")}WhatsApp</button><button class="btn small icon" data-copy="res" data-id="${s.id}" aria-label="Copiar">${ic("copy")}</button><button class="btn small ghost" data-flag="reservaEnviada" data-id="${s.id}">Ya enviada</button>`,
      `${DABR[parse(s.fecha).getDay()]} ${parse(s.fecha).getDate()}`)).join("") : vacio("Todas las reservas están enviadas."), null, true);
  const ids = Object.keys(deben).sort(byName);

/* ---------- Vista: Semana ---------- */
const T0 = 540, T1 = 1260, NROWS = (T1-T0)/15;
function chipHtml(s, col){
  const r = Math.round((toMin(s.hora)-T0)/15); if (r < 0 || r >= NROWS) return "";
  const {n,total} = numEnMes(s);
  const pago = cobrable(s) || s.pagado ? `<i class="mini ${s.pagado?"paid":"unpaid"}" title="${s.pagado?"Pagado":"Sin pagar"}"></i>` : "";
  const unsent = s.estado === "programada" && !s.reservaEnviada ? " unsent" : "";
  if (!activa(s)) return `<button class="chip cancelada" style="grid-row:${r+2}/span 3;grid-column:${col}" data-open="${s.id}" title="${esc(cli(s.clienteId).nombre)} · canceló a tiempo"><b>${esc(iniciales(cli(s.clienteId).nombre))}</b></button>`;
  return `<button class="chip ${s.estado}${unsent}" style="grid-row:${r+2}/span 3;grid-column:${col}" data-open="${s.id}"><b>${esc(cli(s.clienteId).nombre)}</b><small>${s.hora} · ${n}/${total} ${pago}</small></button>`;
}
function calGrid(dias, conCabecera){
  const hoy = todayStr(), cols = dias.length;
  let g = `<div class="tg" style="grid-template-columns:52px repeat(${cols},minmax(${cols>1?118:0}px,1fr));grid-template-rows:${conCabecera?"auto":"0"} repeat(${NROWS},19px)">`;
  g += `<div class="tgh corner"></div>`;
  dias.forEach((f,i) => { const d = parse(f), seg = maxSeguidas(f);
    g += conCabecera ? `<div class="tgh ${f===hoy?"today":""}" style="grid-column:${i+2}"><b>${DIAS[d.getDay()]}</b><span>${d.getDate()}</span><em>${delDia(f).filter(activa).length} ses.</em>${seg > MAX_SEGUIDAS ? `<span class="w">${seg} seguidas</span>` : ""}</div>` : `<div style="grid-column:${i+2}"></div>`; });
  for (let r=0; r<NROWS; r+=4) g += `<div class="tgl" style="grid-row:${r+2}/span 4">${fromMin(T0+r*15)}</div>`;
  dias.forEach((f,i) => {
    const col = i+2, e = endMin(f);
    for (let r=0; r<NROWS; r++){
      const m = T0 + r*15; if (m >= e) break;
      const cls = (r%4===0 ? "hr" : r%2===0 ? "half" : "") + (f===hoy ? " today" : "");
      g += m + DURACION <= e
        ? `<button class="q ${cls}" style="grid-row:${r+2};grid-column:${col}" data-new="${f}|${fromMin(m)}" aria-label="Añadir sesión el ${fechaLarga(f)} a las ${fromMin(m)}"><span>+ ${fromMin(m)}</span></button>`
        : `<div class="q ${cls}" style="grid-row:${r+2};grid-column:${col}"></div>`;
    }
    if (e < T1) g += `<div class="closed" style="grid-row:${(e-T0)/15+2}/span ${(T1-e)/15};grid-column:${col}"><span>Cerrado</span></div>`;
    delDia(f).forEach(s => { g += chipHtml(s, col); });
  });
  return g + `</div>`;
}

  h += `<div class="wk-desk"><section class="panel"><div class="ph"><h2>Calendario</h2><span class="hint">Pulsa un hueco para añadir una sesión</span></div><div class="cal-wrap">${calGrid(dias, true)}</div>${legend}</section></div>`;
  let mob = `<div class="days">${dias.map(f => { const d = parse(f); return `<button data-day="${f}" aria-pressed="${f===ui.day}"><b>${DABR[d.getDay()]}</b><span>${d.getDate()}</span><em>${delDia(f).filter(activa).length} ses.</em></button>`; }).join("")}</div>`;
  const seg = maxSeguidas(ui.day);

  openModal(id ? c.nombre : "Nuevo cliente", id ? `${suyas.filter(activa).length} sesiones registradas` : "", b, foot);
  const $ = q => document.getElementById(q);
  $("csave").onclick = () => { const nombre = $("cn").value.trim(); if (!nombre) return toast("Escribe el nombre"); put("clientes", { ...(id ? S.clientes[id] : { id:uid() }), nombre, telefono:$("ct").value.trim(), nota:$("cno").value.trim() }); closeModal(); };
  if (id){
    $("cdel").onclick = () => { if (suyas.length) return toast("Tiene sesiones registradas. Elimínalas antes o deja el cliente."); if (confirm("¿Eliminar este cliente?")) { remove("clientes", id); closeModal(); } };
    $("cplan").onclick = () => { const t = msgSemana(id, mondayOf(parse(proximas[0].fecha))); if (t) enviar(c.telefono, t); };
  }
}

function modalPlanSemanal(){
  const lunes = ui.week, ini = ymd(lunes), fin = ymd(addDays(lunes,6));
  const ids = [...new Set(ses().filter(s => s.fecha >= ini && s.fecha <= fin && activa(s)).map(s => s.clienteId))].sort(byName);
  const marcar = cid => ses().filter(s => s.clienteId === cid && s.fecha >= ini && s.fecha <= fin && activa(s) && !s.reservaEnviada).forEach(s => patch("sesiones", s.id, {reservaEnviada:true}));
  const body = ids.length ? ids.map(id => { const n = ses().filter(s => s.clienteId === id && s.fecha >= ini && s.fecha <= fin && activa(s)).length;
    return `<div class="item" style="padding:10px 0"><div class="avatar">${esc(iniciales(cli(id).nombre))}</div><div class="who"><b>${esc(cli(id).nombre)}</b><span>${n} ${n===1?"sesión":"sesiones"}</span></div><div class="acts"><button class="btn small wa" data-pw="${id}">${ic("wa")}Enviar</button><button class="btn small icon" data-pc="${id}" aria-label="Copiar">${ic("copy")}</button></div></div>`; }).join("")
    : `<p style="color:var(--muted)">No hay sesiones esta semana.</p>`;
  openModal("Plan de la semana", "Un mensaje por cliente con todas sus sesiones", body, `<span></span><button class="btn" data-close="1">Cerrar</button>`);
  document.querySelector(".sheet").addEventListener("click", e => {
    const w = e.target.closest("[data-pw]"), c = e.target.closest("[data-pc]");
    if (w) { const id = w.dataset.pw; enviar(cli(id).telefono, msgSemana(id, lunes), () => marcar(id)); w.innerHTML = `${ic("check")}Enviado`; }
    if (c) { const id = c.dataset.pc; copiar(msgSemana(id, lunes)); marcar(id); }
  });
}

/* ---------- Acciones ---------- */
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.open) return modalSesion(d.open);
  if (d.new !== undefined) { const [f,h] = d.new.split("|"); return modalSesion(null, f, h); }
  if (d.estado) return patch("sesiones", d.id, { estado:d.estado });
  if (d.flag) return patch("sesiones", d.id, { [d.flag]:true });
  if (d.wa) { const s = S.sesiones[d.id], rec = d.wa === "rec"; return enviar(cli(s.clienteId).telefono, rec ? msgRecordatorio(s) : msgReserva(s), () => patch("sesiones", s.id, rec ? {recordatorioEnviado:true} : {reservaEnviada:true})); }
  if (d.copy) { const s = S.sesiones[d.id], rec = d.copy === "rec"; copiar(rec ? msgRecordatorio(s) : msgReserva(s)); return patch("sesiones", s.id, rec ? {recordatorioEnviado:true} : {reservaEnviada:true}); }
  if (d.pagar) { const l = ses().filter(s => s.clienteId === d.pagar && cobrable(s) && !s.pagado && (!d.mes || mkey(s.fecha) === d.mes)); l.forEach(s => patch("sesiones", s.id, {pagado:true})); return toast(`${l.length} ${l.length===1?"sesión marcada":"sesiones marcadas"} como pagadas`); }
  if (d.week !== undefined) { const n = Number(d.week); ui.week = n === 0 ? mondayOf(new Date()) : addDays(ui.week, 7*n); if (n === 0 && parse(todayStr()).getDay() === 0) ui.week = addDays(ui.week,7); ui.day = n === 0 && parse(todayStr()).getDay() !== 0 ? todayStr() : ymd(ui.week); return render(); }
  if (d.day) { ui.day = d.day; return render(); }
  if (d.month) { const [y,m] = ui.month.split("-").map(Number); ui.month = ymd(new Date(y, m-1+Number(d.month), 1)).slice(0,7); return render(); }
  if (d.cliente !== undefined) return modalCliente(d.cliente || null);
  if (d.copyweek) return copiarSemana();
  if (d.plan) return modalPlanSemanal();
  if (d.export) return exportar(d.export);
  if (d.backup) return guardarCopia();
  if (d.restore) return document.getElementById("fileRestore").click();
});

function copiarSemana(){
  const pi = ymd(addDays(ui.week,-7)), pf = ymd(addDays(ui.week,-1));
  const prev = ses().filter(s => s.fecha >= pi && s.fecha <= pf && activa(s));
  if (!prev.length) return toast("La semana anterior no tiene sesiones");
  if (!confirm(`Se copiarán ${prev.length} sesiones de la semana anterior a esta, con el mismo cliente, día y hora. ¿Continuar?`)) return;
  let n = 0;
  prev.forEach(s => { const fecha = ymd(addDays(parse(s.fecha),7)); if (ses().some(x => x.fecha === fecha && x.hora === s.hora && activa(x))) return;
    put("sesiones", { id:uid(), clienteId:s.clienteId, fecha, hora:s.hora, estado:"programada", pagado:false, nota:"", reservaEnviada:false, recordatorioEnviado:false }); n++; });
  toast(`${n} sesiones copiadas. Envía el plan semanal a cada cliente.`);
}

async function descargar(nombre, texto, mime){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto],{type:mime})); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); return true;
}
async function exportar(mk){
  const l = ses().filter(s => mkey(s.fecha) === mk).sort(byTime);
  if (!l.length) return toast("No hay sesiones en este mes");
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const filas = [["Fecha","Hora","Cliente","Estado","Se cobra","Pagado","Nota"].join(";")].concat(l.map(s => [s.fecha.split("-").reverse().join("/"), s.hora, q(cli(s.clienteId).nombre), ESTADOS[s.estado].t, cobrable(s)?"Sí":"No", s.pagado?"Sí":"No", q(s.nota||"")].join(";")));
  await descargar(`sesiones-${mk}.csv`, "\uFEFF"+filas.join("\r\n"), "text/csv");
}

/* ---------- Copia de seguridad ---------- */
function ultimaCopia(){ if (copiaCompartida && copiaCompartida.fecha) return copiaCompartida.fecha; try { return localStorage.getItem("psr_ultima_copia"); } catch(e){ return null; } }
function diasDesdeCopia(){ const u = ultimaCopia(); return u ? Math.floor((parse(todayStr()) - parse(u)) / 86400000) : null; }
async function guardarCopia(){
  const datos = { app:"agenda-patri", version:1, guardado:new Date().toISOString(), clientes:Object.values(S.clientes), sesiones:Object.values(S.sesiones) };
  const ok = await descargar(`agenda-patri-${todayStr()}.json`, JSON.stringify(datos, null, 1), "application/json");
  if (!ok) return;
  try { localStorage.setItem("psr_ultima_copia", todayStr()); } catch(e){}
  copiaCompartida = { fecha: todayStr(), por: me.name || null }; await sb.from("ajustes").upsert({ id:"copia", data:copiaCompartida });
  toast("Copia guardada. Muévela a tu carpeta si no se guardó ahí directamente."); render();
}
document.getElementById("fileRestore").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch(_){ return toast("Ese archivo no es una copia válida de la agenda."); }
  if (d.app !== "agenda-patri" || !Array.isArray(d.clientes) || !Array.isArray(d.sesiones)) return toast("Ese archivo no es una copia válida de la agenda.");
  if (!confirm(`Esta copia es del ${new Date(d.guardado).toLocaleDateString("es-ES")} y tiene ${d.clientes.length} clientes y ${d.sesiones.length} sesiones. Sustituirá lo que tienes ahora. ¿Restaurar?`)) return;
  const nuevo = { clientes:{}, sesiones:{} };
  d.clientes.forEach(c => { if (c && c.id) nuevo.clientes[c.id] = c; });
  d.sesiones.forEach(s => { if (s && s.id) nuevo.sesiones[s.id] = s; });
  const viejo = S; S = nuevo; render(); toast("Restaurando…");
  try {
    for (const col of TABLAS){
      const fuera = Object.keys(viejo[col]).filter(id => !nuevo[col][id]);
      for (let i=0; i<fuera.length; i+=200){ const { error } = await sb.from(col).delete().in("id", fuera.slice(i,i+200)); if (error) throw error; }
      const filas = Object.values(nuevo[col]).map(o => ({ id:o.id, data:o }));
      for (let i=0; i<filas.length; i+=300){ const { error } = await sb.from(col).upsert(filas.slice(i,i+300)); if (error) throw error; }
    }
    toast("Copia restaurada");
  } catch(_){ toast("La restauración se ha cortado. Vuelve a restaurar la misma copia."); }
});

let tt;
function toast(t){ let el = document.querySelector(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = t; clearTimeout(tt); tt = setTimeout(() => el.remove(), 2800); }

init();
</script>
