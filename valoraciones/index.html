<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valoraciones">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex">
<title>Valoración funcional · Patri S. Rodeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --marino:#14213D;--mostaza:#F5B700;--pizarra:#5F6B7A;--niebla:#A9B4C4;--hueso:#F4F5F7;
  --bg:#F4F5F7;--surface:#fff;--ink:#14213D;--muted:#5F6B7A;--line:#DDE1E7;--soft:#E9ECF1;
  --g:#1F7A4D;--a:#B07800;--r:#B42318;--gbg:rgba(31,122,77,.12);--abg:rgba(245,183,0,.22);--rbg:rgba(180,35,24,.1);
  --btn:#14213D;--btnink:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A31;--surface:#14213D;--ink:#F4F5F7;--muted:#A9B4C4;--line:#2A3858;--soft:#1B2A4B;
  --g:#5FD39A;--a:#F5B700;--r:#FF8A80;--gbg:rgba(95,211,154,.14);--abg:rgba(245,183,0,.16);--rbg:rgba(255,138,128,.14);
  --btn:#F4F5F7;--btnink:#14213D}}
:root[data-theme="dark"]{
  --bg:#0F1A31;--surface:#14213D;--ink:#F4F5F7;--muted:#A9B4C4;--line:#2A3858;--soft:#1B2A4B;
  --g:#5FD39A;--a:#F5B700;--r:#FF8A80;--gbg:rgba(95,211,154,.14);--abg:rgba(245,183,0,.16);--rbg:rgba(255,138,128,.14);
  --btn:#F4F5F7;--btnink:#14213D}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3,h4{font-family:Sora,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0 0 .6em}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:84px}
.logo{height:64px;width:auto;display:block}
@media (max-width:600px){.top .wrap{min-height:70px}.logo{height:50px}.steps{top:calc(env(safe-area-inset-top,0px) + 70px)!important}}
.logo.neg{display:none;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.cl{display:none}:root:not([data-theme="light"]) .logo.neg{display:block}}
:root[data-theme="dark"] .logo.cl{display:none}:root[data-theme="dark"] .logo.neg{display:block}
.store{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.store i{width:8px;height:8px;border-radius:50%;background:var(--niebla);flex:none}
.store.ok i{background:var(--g)}.store.saving i{background:var(--mostaza)}.store.err i{background:var(--r)}

/* buttons */
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:transparent;color:var(--r);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.home{padding:28px 0 60px}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home-head p{color:var(--muted);margin:6px 0 0}
.search{width:100%;margin:6px 0 14px}
.clist{display:grid;gap:10px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;color:var(--ink);width:100%}
.citem:hover{border-color:var(--niebla)}
.citem .nm{font-family:Sora,sans-serif;font-weight:600;font-size:1.05rem}
.citem .meta{font-size:.87rem;color:var(--muted)}
.citem .due{font-size:.82rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.citem .due.late{background:var(--abg);color:var(--a)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* editor */
.ed-head{padding:18px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ed-head h1{flex:1;min-width:200px}
.back{background:transparent;border:0;color:var(--muted);font-weight:500;padding:8px 0;min-height:40px}
.sess{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.steps{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--bg);z-index:20}
.steps::-webkit-scrollbar{display:none}
.steps button{border:0;background:transparent;color:var(--muted);padding:12px 12px 10px;font-weight:500;font-size:.93rem;white-space:nowrap;border-bottom:3px solid transparent}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--mostaza);font-weight:600}
.steps button .n{font-family:Sora,sans-serif;font-weight:700;margin-right:5px}
.panel{padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin-bottom:12px}
.hint{font-size:.87rem;color:var(--muted);margin:-6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.grid,.grid.g2{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:500;color:var(--muted)}
.f.full{grid-column:1/-1}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=tel],select,textarea{font:500 1rem Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;min-height:44px}
textarea{min-height:92px;resize:vertical;line-height:1.45}
.checks{display:grid;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:.95rem}
.checks label:first-child{border-top:0}
input[type=checkbox]{width:20px;height:20px;accent-color:#14213D;flex:none;margin-top:1px}
.alert{border-radius:12px;padding:14px 16px;background:var(--rbg);color:var(--r);font-weight:600;margin-bottom:16px}
.alert span{display:block;font-weight:400;color:var(--ink);font-size:.93rem;margin-top:4px}
.note{border-radius:12px;padding:12px 16px;background:var(--soft);font-size:.92rem;margin-bottom:16px}

/* slider */
.slide{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:14px;align-items:center}
.slide .v{font-family:Sora,sans-serif;font-weight:700;font-size:1.7rem;text-align:right}
input[type=range]{width:100%;accent-color:#F5B700;height:32px}
.psfs{display:grid;gap:14px}
.psfs .item{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.psfs .item:first-child{border-top:0;padding-top:0}
@media (max-width:640px){.psfs .item{grid-template-columns:1fr}}

/* tests */
.test{border-top:1px solid var(--line);padding:16px 0}
.test:first-of-type{border-top:0;padding-top:4px}
.test-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.test-top h4{font-family:Sora,sans-serif;font-weight:600;font-size:1rem}
.test .how{font-size:.86rem;color:var(--muted);margin:3px 0 10px}
.test .ref{font-size:.82rem;color:var(--muted)}
.tin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(120px,1.1fr);gap:10px;align-items:end}
@media (max-width:760px){.tin{grid-template-columns:repeat(2,minmax(0,1fr))}}
.star{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;white-space:nowrap;min-height:34px}
.star[aria-pressed="true"]{background:var(--abg);color:var(--ink);border-color:var(--mostaza)}
.res{border-radius:10px;padding:8px 10px;min-height:44px;display:flex;flex-direction:column;justify-content:center;background:var(--soft);font-size:.82rem;color:var(--muted)}
.res b{font-family:Sora,sans-serif;font-size:1.1rem;color:var(--ink)}
.res.g{background:var(--gbg)}.res.g b{color:var(--g)}
.res.a{background:var(--abg)}.res.a b{color:var(--a)}
.res.r{background:var(--rbg)}.res.r b{color:var(--r)}
.qrow{display:grid;grid-template-columns:minmax(0,1.3fr) 140px minmax(0,1.3fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .qn{font-weight:600}
.qrow .qd{font-size:.83rem;color:var(--muted)}
@media (max-width:700px){.qrow{grid-template-columns:1fr 1fr}.qrow .qi{grid-column:1/-1}}
.phase{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase .pn{font-family:Sora,sans-serif;font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btnink);display:flex;align-items:center;justify-content:center;margin-top:8px}
@media (max-width:640px){.phase{grid-template-columns:34px minmax(0,1fr)}.phase .f:last-child{grid-column:2}}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:8px}

/* result / client view */
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.r-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:22px}
.r-head .who{font-family:Sora,sans-serif;font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);line-height:1.1}
.r-head .sub{color:var(--muted);margin-top:4px}
.r-goal{border-left:4px solid var(--mostaza);padding:6px 14px;font-size:1.05rem;margin-bottom:24px;max-width:70ch}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
@media (max-width:760px){.big3{grid-template-columns:1fr}}
.bn{border-radius:14px;padding:18px;background:var(--soft);border-top:6px solid var(--niebla)}
.bn.g{border-top-color:var(--g)}.bn.a{border-top-color:var(--mostaza)}.bn.r{border-top-color:var(--r)}
.bn .t{font-weight:600;font-size:.95rem}
.bn .v{font-family:Sora,sans-serif;font-weight:700;font-size:2.6rem;line-height:1.05;margin:8px 0 4px}
.bn .d{font-size:.87rem;color:var(--muted)}
.bn .lab{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:8px}
.bn.g .lab{background:var(--gbg);color:var(--g)}.bn.a .lab{background:var(--abg);color:var(--a)}.bn.r .lab{background:var(--rbg);color:var(--r)}
.bn .delta{font-size:.85rem;font-weight:600;margin-top:6px}
.r-sec{margin-bottom:24px}
.r-sec h3{margin-bottom:12px}
.pbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr 44px;gap:12px;align-items:center;padding:6px 0;font-size:.95rem}
@media (max-width:560px){.pbar{grid-template-columns:1fr 44px}.pbar .track{grid-column:1/-1;grid-row:2}}
.track{height:14px;background:var(--line);border-radius:7px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--marino);border-radius:7px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .track i{background:var(--hueso)}}
:root[data-theme="dark"] .track i{background:var(--hueso)}
.track s{position:absolute;top:0;bottom:0;width:3px;background:var(--mostaza)}
.pbar .num{font-family:Sora,sans-serif;font-weight:700;text-align:right}
.plan-box{background:var(--soft);border-radius:14px;padding:18px}
.plan-box .pp{font-family:Sora,sans-serif;font-weight:700;font-size:1.25rem}
.plan-box ol{margin:10px 0 0;padding-left:1.2em}
.plan-box li{margin-bottom:6px}
.qres{display:grid;gap:6px}
.qres div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.qres div:first-child{border-top:0}
.qres b{font-family:Sora,sans-serif}
body.present .top,body.present .ed-head,body.present .sess,body.present .steps,body.present .no-present,body.present #home{display:none!important}
body.present .result{border:0;border-radius:0;padding:10px 0 40px;background:transparent}
body.present .wrap{max-width:1100px}
body.present .bn .v{font-size:3.2rem}
.exit-present{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2 ===== */
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.yn:first-child{border-top:0}
.yn .sw{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.yn .sw button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font-weight:600;font-size:.88rem;min-height:40px}
.yn .sw button[aria-pressed="true"].no{background:var(--gbg);color:var(--g)}
.yn .sw button[aria-pressed="true"].si{background:var(--rbg);color:var(--r)}
.yn small{display:block;color:var(--muted);font-size:.82rem}
.verdict{border-radius:12px;padding:12px 16px;font-weight:600;margin-top:12px}
.verdict.g{background:var(--gbg);color:var(--g)}.verdict.a{background:var(--abg);color:var(--a)}.verdict.r{background:var(--rbg);color:var(--r)}
.verdict span{display:block;font-weight:400;color:var(--ink);font-size:.9rem;margin-top:2px}
.map{display:block;width:100%;max-width:520px;margin:0 auto;touch-action:manipulation;cursor:crosshair}
.map .body{fill:var(--soft);stroke:var(--niebla);stroke-width:1.2}
.map text{fill:var(--muted);font:600 9px Inter,sans-serif}
.map .pt{fill:#B42318;fill-opacity:.85;stroke:#fff;stroke-width:1.5;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;background:var(--bg)}
.tags input{width:16px;height:16px}
.act{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
@media (max-width:700px){.act{grid-template-columns:1fr 1fr}.act .x{grid-column:2;justify-self:end}}
.xbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;width:40px;height:44px;font-size:1.1rem}
.doc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(20,33,61,.8);color:#fff;font-size:.85rem;line-height:1}
.addph{width:96px;height:96px;border-radius:10px;border:1px dashed var(--niebla);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;color:var(--muted);cursor:pointer;padding:6px}
.addph input{display:none}
.lightbox{position:fixed;inset:0;background:rgba(10,16,30,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.sig{border:1px dashed var(--niebla);border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.sig-img{background:#fff;border-radius:12px;border:1px solid var(--line);padding:8px;max-width:420px}
.sig-img img{width:100%;display:block}
.legal{font-size:.86rem;color:var(--muted);max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.legal p{margin:0 0 .6em}
.calc{border-radius:10px;padding:10px 12px;background:var(--soft);font-size:.9rem;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.calc b{font-family:Sora,sans-serif;font-size:1.1rem}
.calc.g{background:var(--gbg)}.calc.a{background:var(--abg)}.calc.r{background:var(--rbg)}
.per{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr)) minmax(0,1.1fr);gap:10px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.per:first-child{border-top:0}
@media (max-width:640px){.per{grid-template-columns:1fr 1fr}.per .pl{grid-column:1/-1;font-weight:600}}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ratios{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.settings{max-width:720px}
.busy{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:70;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.busy div{background:#14213D;padding:16px 22px;border-radius:12px;border-top:4px solid #F5B700}
.phbox{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden;background:#000;line-height:0;touch-action:none;vertical-align:top}
.phbox img{display:block;max-width:100%;max-height:75vh;width:auto;height:auto}
.phbox svg{position:absolute;inset:0;width:100%;height:100%}
.phgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.phgrid{grid-template-columns:1fr}}
.painph{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.painph .phbox img{max-height:60vh}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--niebla);flex:none}
.dotc.g{background:var(--g)}.dotc.a{background:var(--mostaza)}.dotc.r{background:var(--r)}
.sw.cons button.si[aria-pressed="true"]{background:var(--gbg);color:var(--g)}
.sw.cons button.no[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.tags .chip{font-size:.85rem}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.cdel{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;width:52px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cdel:hover{color:var(--r);border-color:var(--r)}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:440px;width:100%;border-top:4px solid var(--mostaza);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h3{font-size:1.15rem;margin-bottom:8px}.mbox p{color:var(--muted);margin:0 0 6px}
.mbox input{font:500 1rem Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%;min-height:44px;margin-top:8px}
.btn.danger{background:var(--r);border-color:var(--r);color:#fff}
</style>

async function flush(id){

  store.writing[id]=true;store.dirty[id]=false;
  const ref=store.db.collection('data/users/'+store.uid).doc(id);
  try{
    if(store.clients[id]){const body=JSON.stringify(store.clients[id]);if(body.length>250000)throw {code:'too_big'};await ref.set(JSON.parse(body))}
    else await ref.delete();
    statusIdle();
  }catch(e){
    if(e&&e.code==='unavailable'){setTimeout(()=>{store.writing[id]=false;flush(id)},800+Math.random()*800);return}
    setStatus('err',e&&e.code==='quota_exceeded'?'Espacio lleno: borra clientes antiguos':e&&e.code==='too_big'?'Ficha demasiado grande: borra reevaluaciones antiguas':'No se pudo guardar en la nube; queda en este navegador');
  }

function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}

async function compress(file){
  const img=await loadImage(await readFile(file));
  let max=1600,q=.75,out='';
  for(let i=0;i<10;i++){
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
    out=cv.toDataURL('image/jpeg',q);
    if(out.length<235000)return out;
    if(q>.5)q-=.1;else{max=Math.round(max*.8);q=.65}
  }
  return out.length<250000?out:null;
}

    s.iv=s.iv||{};['red','rfp','yel','parq','reasons','tipo'].forEach(k=>{if(!s.iv[k])s.iv[k]={}});if(!s.iv.map)s.iv.map=[];if(!s.iv.act)s.iv.act=[{}];

/* ============ CÁLCULOS ============ */
function evalTest(t,e,c,s){
  e=e||{};const u=t.u?' '+t.u:'';
  if(t.k==='bi'||t.k==='bd'){
    const r=num(e.r),l=num(e.l);if(r==null||l==null)return null;
    const af=affSide(c);const A=af==='l'?l:r,S=af==='l'?r:l;
    let det=af?`Afectado ${fmtN(A)}${u} · sano ${fmtN(S)}${u}`:`Derecho ${fmtN(r)}${u} · izquierdo ${fmtN(l)}${u}`;
    const w=weightOf(c,s);if(t.u==='N'&&w)det+=` · ${fmtN(A/w,2)} y ${fmtN(S/w,2)} N/kg`;
    if(t.k==='bd'){
      const d=Math.abs(r-l);let col=null,lab='';
      if(t.thr!=null){col=d>t.thr?'r':d>t.thr/2?'a':'g';lab=col==='r'?`Asimetría relevante (>${fmtN(t.thr)}${u})`:col==='a'?'Asimetría leve':'Simétrico'}
      else{col=e.m||null;lab=col==='g'?'Bien':col==='a'?'Mejorable':col==='r'?'A trabajar':''}
      return {main:`${fmtN(d)}${u} dif.`,val:d,col,lab,det,low:true};
    }
    if(r<=0||l<=0)return null;
    let lsi;if(af)lsi=t.dir==='lo'?S/A*100:A/S*100;else lsi=Math.min(r,l)/Math.max(r,l)*100;
    const col=lsi>=90?'g':lsi>=80?'a':'r';
    return {main:Math.round(lsi)+' %',val:lsi,col,lab:col==='g'?'Simétrico (≥90 %)':col==='a'?'Déficit leve (80–89 %)':'Déficit claro (<80 %)',det};
  }
  const v=num(e.v);
  if(v==null&&!(e.m))return null;
  let rr=null;if(t.rule&&v!=null)rr=RULES[t.rule](v,c);
  const col=rr?rr[0]:(e.m||null),lab=rr?rr[1]:(e.m==='g'?'Bien':e.m==='a'?'Mejorable':e.m==='r'?'A trabajar':'');
  let det='';const w=weightOf(c,s);if(t.u==='N'&&w&&v!=null)det=`${fmtN(v/w,2)} N/kg`;
  return {main:v!=null?fmtN(v)+u:'—',val:v,col,lab,det};
}
function deltaTest(t,e0,e1,c,s0,s1){
  const a=evalTest(t,e0,c,s0),b=evalTest(t,e1,c,s1);if(!a||!b||a.val==null||b.val==null)return null;
  const d=b.val-a.val;const lower=t.k==='bd'||(t.k==='one'&&t.dir==='lo');const better=lower?d<0:d>0;
  const txt=t.k==='bi'?`${d>0?'+':''}${fmtN(d,0)} puntos de simetría`:`${d>0?'+':''}${fmtN(d)}${t.u?' '+t.u:''}${t.k==='bd'?' de diferencia':''}`;
  return {txt,better,zero:Math.abs(d)<1e-9};
}
function qEval(id,v){const q=Q[id];if(v==null||v==='')return null;if(q.cat)return q.interp?q.interp(v):null;const n=num(v);if(n==null)return null;return q.interp?q.interp(n):null}
function qDelta(id,v0,v1){const q=Q[id];if(q.cat)return null;const a=num(v0),b=num(v1);if(a==null||b==null)return null;const imp=q.dir==='lo'?a-b:b-a;return {imp,rel:q.mcid!=null?imp>=q.mcid:null}}
function parqResult(s){

function anthroCalc(c,s){
  const a=s.anthro||{};const w=num(a.weight),h=num(a.height);const o={};
  if(w&&h){const b=w/Math.pow(h/100,2);o.bmi=[fmtN(b),b<18.5?['a','Bajo peso']:b<25?['g','Normopeso']:b<30?['a','Sobrepeso']:['r','Obesidad']]}

  const f=num(g('mcF').v),e=num(g('bs').v);if(f&&e){const r=f/e;out.push({n:'Flexores / extensores de tronco',v:fmtN(r,2),col:r>1?'a':'g',d:r>1?'Flexores más resistentes que extensores (>1)':'≤1 (referencia McGill ≈0,77)'})}
  const sr=num(g('sb').r),sl=num(g('sb').l);if(sr&&sl){const r=sr/sl;out.push({n:'Plancha lateral dcha / izda',v:fmtN(r,2),col:Math.abs(1-r)>.05?'a':'g',d:Math.abs(1-r)>.05?'Diferencia >5 % entre lados':'Equilibrada (0,95–1,05)'})}

function field(label,path,opts={}){
  const v=getP(path);const cls=opts.full?'f full':'f';const re=opts.re?' data-re="1"':'';
  if(opts.type==='select')return `<label class="${cls}">${label}<select data-b="${path}"${re}>${opts.o.map(o=>{const [val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
  if(opts.type==='area')return `<label class="${cls}">${label}<textarea data-b="${path}" placeholder="${esc(opts.ph||'')}">${esc(v||'')}</textarea></label>`;
  return `<label class="${cls}">${label}<input type="${opts.type||'text'}" data-b="${path}"${re} value="${esc(v??'')}" ${opts.ph?`placeholder="${esc(opts.ph)}"`:''} ${opts.type==='number'?'inputmode="decimal" step="any"':''} ${opts.ac?`autocomplete="${opts.ac}"`:''}></label>`;
}
function getP(path){const [root,...ks]=path.split('.');let o=root==='c'?cur():sess();for(const k of ks){if(o==null)return undefined;o=o[k]}return o}
function setP(path,val){const [root,...ks]=path.split('.');let o=root==='c'?cur():sess();for(let i=0;i<ks.length-1;i++){const k=ks[i];if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k]}o[ks[ks.length-1]]=val}
function bind(root){
  root.querySelectorAll('[data-b]').forEach(el=>{
    const ev=el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'?'change':'input';
    el.addEventListener(ev,()=>{
      let v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;

}

function sigPad(box,c,key,label){
  function show(){
    if(!box)return;
    if(c.consent[key]){box.innerHTML=`<div class="sig-img"><img src="${c.consent[key]}" alt="${label}"></div><div class="row" style="margin-top:10px"><button class="btn ghost sm" type="button" data-redo>Firmar de nuevo</button></div>`;box.querySelector('[data-redo]').onclick=()=>{c.consent[key]=null;if(key==='sig')c.consent.date=null;queueSave(c.id);show();refresh()};return}
    box.innerHTML=`<canvas class="sig" aria-label="Zona de ${label.toLowerCase()}"></canvas><div class="row" style="margin-top:10px"><button class="btn ghost sm" type="button" data-clear>Borrar</button><button class="btn sm" type="button" data-save>Guardar firma</button><span class="hint" style="margin:0">Firma con el dedo o con el Apple Pencil.</span></div>`;
    const cv=box.querySelector('canvas'),dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;
    const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#14213D';x.fillStyle='#14213D';
    let draw=false,dirty=false,last=null;const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
    cv.onpointerdown=e=>{draw=true;last=pos(e);cv.setPointerCapture(e.pointerId);x.beginPath();x.arc(last[0],last[1],1.1,0,7);x.fill();dirty=true};
    cv.onpointermove=e=>{if(!draw)return;const p2=pos(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p2[0],p2[1]);x.stroke();last=p2};
    cv.onpointerup=cv.onpointercancel=()=>{draw=false};
    box.querySelector('[data-clear]').onclick=()=>{x.clearRect(0,0,cv.width,cv.height);dirty=false};
    box.querySelector('[data-save]').onclick=()=>{if(!dirty){toast('Falta la firma');return}
      if(!cOK(c,'health')){toast('Falta el SÍ al consentimiento de datos de salud');return}
      const o=document.createElement('canvas');const sc=Math.min(1,700/cv.width);o.width=cv.width*sc;o.height=cv.height*sc;o.getContext('2d').drawImage(cv,0,0,o.width,o.height);
      c.consent[key]=o.toDataURL('image/png');if(key==='sig')c.consent.date=today();queueSave(c.id);show();refresh();toast('Firma guardada')};
  }
  show();
}

}
function wireEntrevista(p,c,s){
  // fotos
  p.querySelectorAll('[data-img]').forEach(async im=>{const d=await getImg(c.id,im.dataset.img);if(d)im.src=d;else im.alt='Foto no disponible en este dispositivo'});
  p.querySelectorAll('[data-img]').forEach(im=>im.onclick=()=>{if(!im.src)return;const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML=`<img src="${im.src}" alt="Informe"><button class="btn" type="button">Cerrar</button>`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)});
  $('#doc-add').onclick=()=>{s.docs.push({id:uid(),type:'',date:'',desc:'',imgs:[]});queueSave(c.id);renderPanel()};
  p.querySelectorAll('[data-deldoc]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.deldoc;if(!(await dialog({title:'¿Quitar este informe y sus fotos?',ok:'Quitar',danger:true})))return;(s.docs[i].imgs||[]).forEach(iid=>delImg(c.id,iid));s.docs.splice(i,1);queueSave(c.id);renderPanel()});
  p.querySelectorAll('[data-delimg]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [i,iid]=b.dataset.delimg.split(':');const d=s.docs[+i];d.imgs=d.imgs.filter(x=>x!==iid);delImg(c.id,iid);queueSave(c.id);renderPanel()});
  p.querySelectorAll('[data-upl]').forEach(inp=>inp.onchange=async()=>{const d=s.docs[+inp.dataset.upl];const files=[...inp.files];if(!files.length)return;busy(true,'Guardando fotos…');
    let ok=0;for(const f of files){try{const data=await compress(f);if(!data){toast('Foto demasiado grande');continue}const iid='i'+uid();if(await putImg(c.id,iid,data)){d.imgs=d.imgs||[];d.imgs.push(iid);ok++}}catch(e){toast('No se pudo leer la foto')}}
    busy(false);queueSave(c.id);renderPanel();if(ok)toast(ok===1?'Foto guardada':ok+' fotos guardadas')});
  if($('#map'))wireEntrevista.map(c,s);
  wirePhotoBoxes(p,c,s,full=>{if(full){const y=window.scrollY;renderPanel();window.scrollTo(0,y)}});
  // actividades
  $('#act-add').onclick=()=>{s.iv.act.push({});queueSave(c.id);renderPanel()};
  p.querySelectorAll('[data-delact]').forEach(b=>b.onclick=()=>{s.iv.act.splice(+b.dataset.delact,1);if(!s.iv.act.length)s.iv.act.push({});queueSave(c.id);renderPanel()});
  // PAR-Q
  p.querySelectorAll('[data-parq]').forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.parq.split(':');s.iv.parq['q'+i]=v;queueSave(c.id);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));refresh()});
}
wireEntrevista.map=(c,s)=>{const svg=$('#map');
  svg.onclick=e=>{const t=e.target;if(t.dataset&&t.dataset.pt!=null){s.iv.map.splice(+t.dataset.pt,1)}else{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return;const q=pt.matrixTransform(m.inverse());s.iv.map.push({x:Math.round(q.x),y:Math.round(q.y)})}queueSave(c.id);$('#map-wrap').innerHTML=mapSVG(s,true);wireEntrevista.map(c,s)}};

function pCuest(c,s){
  const ids=qFor(c);
  if(!ids.length)return `<div class="empty">Elige el perfil de valoración en el paso 1 para ver los cuestionarios.</div>`;
  return `<div class="card"><h3>Cuestionarios · ${esc(PROF[c.profile].n)}</h3><p class="hint">Idealmente los rellena en casa 48 h antes. Anota aquí la puntuación final.</p>
  ${ids.map(id=>{const q=Q[id];const v=s.q[id];return `<div class="qrow"><div><div class="qn">${esc(q.n)}</div><div class="qd">${q.cat?'Categoría':'Rango '+q.r+(q.dir==='lo'?' · menos es mejor':' · más es mejor')}</div></div>
  <div>${q.cat?`<select data-b="s.q.${id}" aria-label="${esc(q.n)}"><option value="">—</option>${q.cat.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="number" inputmode="decimal" step="any" data-b="s.q.${id}" value="${esc(v??'')}" aria-label="${esc(q.n)}">`}</div>
  <div class="qi" data-qres="${id}" style="font-size:.87rem"></div></div>`}).join('')}</div>`;

/* ---- tests ---- */
function testRow(t,c,s){
  const e=s.tests[t.id]||{};const af=affSide(c);const lab=sd=>`${sd==='r'?'Derecho':'Izquierdo'}${af===sd?' (afectado)':''}`;const u=t.u?' ('+esc(t.u)+')':'';
  const manualSel=`<label class="f">Semáforo<select data-b="s.tests.${t.id}.m"><option value="">—</option><option value="g" ${e.m==='g'?'selected':''}>Verde · bien</option><option value="a" ${e.m==='a'?'selected':''}>Ámbar · mejorable</option><option value="r" ${e.m==='r'?'selected':''}>Rojo · a trabajar</option></select></label>`;
  const inputs=(t.k==='bi'||t.k==='bd')?`<label class="f">${lab('r')}${u}<input type="number" inputmode="decimal" step="any" data-b="s.tests.${t.id}.r" value="${esc(e.r??'')}"></label><label class="f">${lab('l')}${u}<input type="number" inputmode="decimal" step="any" data-b="s.tests.${t.id}.l" value="${esc(e.l??'')}"></label>`
    :`<label class="f">Valor${u}<input type="number" inputmode="decimal" step="any" data-b="s.tests.${t.id}.v" value="${esc(e.v??'')}"></label>${t.rule?'<span></span>':manualSel}`;
  return `<div class="test"><div class="test-top"><div><h4>${esc(t.n)}</h4></div><button class="star" type="button" data-star="${t.id}" aria-pressed="${!!e.star}">★ Enseñar</button></div>
    <div class="how">${esc(t.how||'')}${t.ref?` <span class="ref">· ${esc(t.ref)}</span>`:''}</div>
    <div class="tin">${inputs}
    <label class="f">Dolor (0–10)<input type="number" inputmode="numeric" min="0" max="10" data-b="s.tests.${t.id}.p" value="${esc(e.p??'')}"></label>
    <label class="f">Nota<input type="text" data-b="s.tests.${t.id}.n" value="${esc(e.n??'')}" placeholder="Posición, compensación…"></label>
    <div class="res" data-res="${t.id}" aria-live="polite"></div></div>
    ${t.k==='bd'&&t.thr==null?`<div style="max-width:220px;margin-top:10px">${manualSel}</div>`:''}
    ${t.custom?`<button class="btn warn sm" style="margin-top:10px" type="button" data-delc="${t.id}">Quitar test</button>`:''}</div>`;
}
function starNote(s){const n=Object.values(s.tests).filter(e=>e&&e.star).length;return `<div class="note">Lado sano primero: el cliente aprende el test y tú tienes la referencia. Marca con ★ los 3 resultados que le vas a enseñar (${n}/3, sumando esta pestaña y la de la lesión).</div>`}

  ${photoEditorHTML(c,s)}
  ${GEN.map(g=>`<div class="card"><h3>${esc(g.n)}</h3>${g.t.map(id=>testRow(Object.assign({id},T[id]),c,s)).join('')}</div>`).join('')}

  const list=lesionTests(c,s);

  const gen=new Set(genTests());
  return `${starNote(s)}<div class="card"><h3>${esc((PROF[c.profile]||{n:'Tests propios'}).n)}</h3>${list.map(t=>testRow(t,c,s)+(gen.has(t.id)?'':'')).join('')}</div>

    <label class="f">Tipo<select id="ct-k"><option value="bi">Comparar lados (simetría %)</option><option value="bd">Comparar lados (diferencia)</option><option value="one">Valor único</option></select></label>
    <label class="f">Unidad<input type="text" id="ct-u" placeholder="N, cm, s, rep…"></label>

function wireTests(p,c,s){
  p.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star;const e=s.tests[id]||(s.tests[id]={});
    if(!e.star&&Object.values(s.tests).filter(x=>x&&x.star).length>=3){toast('Máximo 3: quita uno antes');return}
    e.star=!e.star;queueSave(c.id);const y=window.scrollY;renderPanel();window.scrollTo(0,y)});
  p.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{s.custom=s.custom.filter(t=>t.id!==b.dataset.delc);delete s.tests[b.dataset.delc];queueSave(c.id);renderPanel()});
  const ad=$('#ct-add');if(ad)ad.onclick=()=>{const n=$('#ct-n').value.trim();if(!n){toast('Escribe el nombre del test');$('#ct-n').focus();return}

async function annotatedPNG(c,ph,vid,mode){

function findings(c,s){
  const out=[];
  allTests(c,s).forEach(t=>{const r=evalTest(t,s.tests[t.id],c,s);if(r&&(r.col==='r'||r.col==='a'))out.push({col:r.col,src:'Test',txt:`${t.n}: ${r.main}${r.lab?' ('+r.lab.toLowerCase()+')':''}`})});
  ratios(c,s).forEach(r=>{if(r.col!=='g')out.push({col:r.col,src:'Ratio',txt:`${r.n}: ${r.v} (${r.d.toLowerCase()})`})});
  qFor(c).forEach(id=>{const r=qEval(id,s.q[id]);if(r&&r[0]!=='g')out.push({col:r[0],src:'Cuestionario',txt:`${Q[id].n}: ${s.q[id]} (${r[1].toLowerCase()})`})});
  const pq=parqResult(s);if(pq.col&&pq.col!=='g')out.push({col:pq.col,src:'PAR-Q+',txt:pq.t});
  const nr=Object.values(s.iv.red||{}).filter(Boolean).length+Object.values(s.iv.rfp||{}).filter(Boolean).length;if(nr)out.push({col:'r',src:'Alarma',txt:`${nr} señal${nr>1?'es':''} de alarma marcada${nr>1?'s':''}${s.iv.redAction?': '+s.iv.redAction:''}`});

}

function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const FKEYS=['name','surname','dni','birth','sex','email','phone','address','profession','activityLevel','activity','origin','dx','injDate','side','reasons','motivo','mech','evol','prevInj','surg','treat','patol','med','docsNote','loc','painNow','painMax','tipo','ritmo','irr','agg','eas','calma','act','sleep','rest','minCasa','dias','parq','beliefs','yel','contexto','t','h','c','s','a','v','d','i','g','p','k'];
const FKM={};FKEYS.forEach((k,i)=>FKM[k]=String(i));
function fMap(o,dir){if(Array.isArray(o))return o.map(x=>fMap(x,dir));if(o&&typeof o==='object'){const r={};Object.entries(o).forEach(([k,v])=>{const nk=dir?(FKM[k]!=null?FKM[k]:k):(/^\d+$/.test(k)&&FKEYS[+k]!=null?FKEYS[+k]:k);r[nk]=fMap(v,dir)});return r}return o}
async function unpackForm(text){
  const m=String(text).replace(/\s+/g,'').match(/PRV([0-3]):([A-Za-z0-9_-]+)/);if(!m)throw new Error('nocode');
  let bytes=fromB64u(m[2]);const ver=+m[1];
  if(ver===1||ver===2){const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(s).arrayBuffer())}
  let d=JSON.parse(new TextDecoder().decode(bytes));
  if(ver>=2){const o=fMap(d,false),i=o.i||{},c=o.c||{};
    if(typeof c.origin==='number')c.origin=ORIG[c.origin]||'';
    if(typeof i.ritmo==='number')i.ritmo=RITMO[i.ritmo]||'';if(typeof i.calma==='number')i.calma=CALMA[i.calma]||'';
    const obj=a=>{const r={};(a||[]).forEach(k=>r[k]=true);return r};
    i.tipo=obj((i.tipo||[]).map(n=>TIPO[n]).filter(Boolean));i.reasons=obj(i.reasons);i.yel=obj(i.yel);
    const pq={};String(i.parq||'').split('').forEach((ch,n)=>{if(ch==='s')pq['q'+n]='si';else if(ch==='n')pq['q'+n]='no'});i.parq=pq;
    const cons={};String(o.k||'').split('').forEach((ch,n)=>{if(CONS[n]&&ch!=='-')cons[CONS[n][0]]=ch==='s'?'si':'no'});

    d={v:1,d:o.d,c,iv:i,goal:o.g||'',psfs:ps,cons};}
  if(!d||d.v!==1||!d.c)throw new Error('bad');return d;
}

  });
  if(d.goal&&!s.goal)s.goal=d.goal;
  if(Array.isArray(d.psfs)&&!s.psfs.some(p=>p.a))s.psfs=d.psfs.slice(0,3).map(p=>({a:p.a||'',v:p.v==null?null:+p.v}));
  c.consent=c.consent||{opts:{}};Object.entries(d.cons||{}).forEach(([k,v])=>{if(!c.consent.opts[k])c.consent.opts[k]=v});
  c.formDate=d.d||today();
  queueSave(c.id);
}
function renderImport(){
  const h=$('#home');
  h.innerHTML=`<div class="ed-head"><button class="back" id="back" type="button">‹ Clientes</button><h1>Importar formulario</h1></div>
  <div class="card settings"><h3>Pega el mensaje del cliente</h3><p class="hint">Copia el mensaje completo de WhatsApp o del email y pégalo aquí. Solo cuenta el código que empieza por PRV.</p>
  <textarea id="imp-t" style="min-height:140px" placeholder="Hola Patri, soy… PRV1:…"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" type="button" id="imp-go">Leer formulario</button><button class="btn ghost" type="button" id="imp-paste">Pegar del portapapeles</button></div></div>
  <div id="imp-res" class="settings"></div>`;
  $('#back').onclick=renderHome;
  $('#imp-paste').onclick=async()=>{try{$('#imp-t').value=await navigator.clipboard.readText()}catch(e){toast('Mantén pulsado el cuadro y elige «Pegar»')}};
  $('#imp-go').onclick=async()=>{
    const r=$('#imp-res');let d;
    try{d=await unpackForm($('#imp-t').value)}catch(e){r.innerHTML=`<div class="alert">No encuentro un formulario válido<span>${e.message==='nocode'?'Falta el código PRV. Comprueba que has copiado el mensaje entero.':'El código está incompleto o dañado. Pide al cliente que lo reenvíe sin modificarlo.'}</span></div>`;return}
    const m=findMatch(d);const nm=[d.c.name,d.c.surname].filter(Boolean).join(' ')||'Sin nombre';
    const reasons=MOTIVOS.filter(([k])=>(d.iv.reasons||{})[k]).map(x=>x[1]).join(', ');
    const pq=parqResult({iv:{parq:d.iv.parq||{}}});
    r.innerHTML=`<div class="card"><h3>${esc(nm)}</h3><div class="qres">
      ${[['Enviado',fmtD(d.d)],['DNI',d.c.dni],['Teléfono',d.c.phone],['Motivo',reasons],['En sus palabras',d.iv.motivo],['Dolor ahora',d.iv.painNow!=null?d.iv.painNow+'/10':''],['PAR-Q+',pq.t],['Datos de salud',d.cons&&d.cons.health==='si'?'Consiente':'No consiente o sin responder']].filter(x=>x[1]).map(([a,b])=>`<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>
      ${pq.col==='r'?`<div class="alert" style="margin-top:12px">PAR-Q+: necesita valoración médica<span>Revísalo antes de la sesión.</span></div>`:''}
      <div class="row" style="margin-top:14px">${m?`<button class="btn" type="button" id="imp-up">Añadir a la ficha de ${esc(fullName(m)||'cliente existente')}</button><button class="btn ghost" type="button" id="imp-new">Crear cliente nuevo</button>`:`<button class="btn" type="button" id="imp-new">Crear cliente</button>`}</div>
      <p class="hint" style="margin:10px 0 0">Los datos del formulario no sustituyen a lo que ya hayas escrito en la ficha. La firma sigue haciéndose en consulta.</p></div>`;
    const done=c=>{applyForm(d,c);toast('Formulario importado');openClient(c.id,0)};
    if(m)$('#imp-up').onclick=()=>done(m);
    $('#imp-new').onclick=()=>done(newClient());
  };
}


/* ================= COPIA DE SEGURIDAD ================= */
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function buildBackup(){
  const clients=Object.values(store.clients).map(c=>JSON.parse(JSON.stringify(c)));const imgs={};
  for(const c of clients)for(const s of c.sessions)for(const iid of sessImgs(s)){const d=await getImg(c.id,iid);if(d)imgs[iid]={c:c.id,d}}
  return {app:'pr-valoraciones',v:1,date:new Date().toISOString(),settings:store.settings,clients,imgs};
}
async function exportBackup(pw){
  busy(true,'Preparando la copia…');
  try{const data=await buildBackup();let txt;
    if(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pw,salt);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data))));
      txt=JSON.stringify({app:'pr-valoraciones',enc:1,salt:b64e(salt),iv:b64e(iv),data:b64e(ct)})}
    else txt=JSON.stringify(data);
    busy(false);
    if(await saveFile(new Blob([txt],{type:'application/json'}),`copia_valoraciones_${today()}.json`)){store.settings.lastBackup=today();saveSettings();toast(`Copia lista: ${data.clients.length} clientes`)}
  }catch(e){busy(false);toast('No se pudo crear la copia')}
}
async function readBackup(text){
  let o=JSON.parse(text);if(!o||o.app!=='pr-valoraciones')throw new Error('format');
  if(o.enc){const pw=await dialog({title:'Contraseña de la copia',text:'Escribe la contraseña que pusiste al hacer la copia.',input:'password',ok:'Abrir'});if(pw===false)return null;
    try{const key=await deriveKey(pw,b64d(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data));o=JSON.parse(new TextDecoder().decode(pt))}catch(e){throw new Error('pw')}}
  return o;
}
async function restoreBackup(o){
  busy(true,'Restaurando…');let n=0;
  for(const c of o.clients||[]){const ex=store.clients[c.id];if(!ex||(c.updated||0)>(ex.updated||0)){migrate(c);store.clients[c.id]=c;queueSave(c.id,true);n++}}
  for(const [iid,v] of Object.entries(o.imgs||{})){if(!(await getImg(v.c,iid)))await putImg(v.c,iid,v.d)}
  if(o.settings){Object.entries(o.settings).forEach(([k,v])=>{if(WEB&&k==='formUrl')return;if(v&&(!store.settings[k]||store.settings[k]===DEFSET[k]))store.settings[k]=v});saveSettings()}
  busy(false);return n;
}
function renderBackup(){
  const h=$('#home');const lb=store.settings.lastBackup;
  h.innerHTML=`<div class="ed-head"><button class="back" id="back" type="button">‹ Clientes</button><h1>Copia de seguridad</h1></div>
  <div class="card settings"><h3>Descargar copia</h3><p class="hint">Un archivo con todos tus clientes, valoraciones, fotos y firmas. Guárdalo en tu ordenador o en Drive. ${lb?'Última copia: '+fmtD(lb)+'.':'Aún no has hecho ninguna copia.'}</p>
  <div class="grid g2"><label class="f">Contraseña (muy recomendable)<input type="password" id="bk-p1" autocomplete="new-password"></label><label class="f">Repite la contraseña<input type="password" id="bk-p2" autocomplete="new-password"></label></div>
  <p class="hint" style="margin-top:10px">Con contraseña, el archivo va cifrado y nadie puede leerlo sin ella. Si la olvidas, no hay forma de recuperarla.</p>
  <div class="row" style="margin-top:10px"><button class="btn" type="button" id="bk-go">Descargar copia</button></div></div>
  <div class="card settings"><h3>Restaurar o pasar datos de otro dispositivo</h3><p class="hint">Elige un archivo de copia. Se añaden los clientes que no tengas y se actualizan los que estén más al día en la copia; no se borra nada.</p>
  <label class="btn ghost" style="display:inline-flex;cursor:pointer">Elegir archivo de copia<input type="file" id="bk-file" accept=".json,application/json" style="display:none"></label></div>`;
  $('#back').onclick=renderHome;
  $('#bk-go').onclick=async()=>{const a=$('#bk-p1').value,b=$('#bk-p2').value;if(a!==b){toast('Las contraseñas no coinciden');return}
    if(!a&&!(await dialog({title:'¿Copia sin contraseña?',text:'Contiene datos de salud de tus clientes. Sin contraseña, cualquiera que tenga el archivo podrá leerlo.',ok:'Descargar sin contraseña'})))return;
    exportBackup(a)};
  $('#bk-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
    try{const o=await readBackup(await f.text());if(!o)return;
      if(!(await dialog({title:'Restaurar copia',text:`Copia del ${fmtD(String(o.date).slice(0,10))} con ${(o.clients||[]).length} clientes y ${Object.keys(o.imgs||{}).length} fotos.`,ok:'Restaurar'})))return;
      const n=await restoreBackup(o);toast(`${n} clientes restaurados o actualizados`);renderHome()}
    catch(err){busy(false);toast(err.message==='pw'?'Contraseña incorrecta':'Ese archivo no es una copia válida')}};
}

initStore();
})();
