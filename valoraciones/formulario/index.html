<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Formulario previo a tu valoración · Patri S. Rodeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;600;700&display=swap" rel="stylesheet">
<style>
:root{--marino:#14213D;--mostaza:#F5B700;--bg:#F4F5F7;--surface:#fff;--ink:#14213D;--muted:#5F6B7A;--line:#DDE1E7;--soft:#E9ECF1;--g:#1F7A4D;--gbg:rgba(31,122,77,.12);--r:#B42318;--rbg:rgba(180,35,24,.1);--btn:#14213D;--btnink:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A31;--surface:#14213D;--ink:#F4F5F7;--muted:#A9B4C4;--line:#2A3858;--soft:#1B2A4B;--g:#5FD39A;--gbg:rgba(95,211,154,.14);--r:#FF8A80;--rbg:rgba(255,138,128,.14);--btn:#F4F5F7;--btnink:#14213D}}
:root[data-theme="dark"]{--bg:#0F1A31;--surface:#14213D;--ink:#F4F5F7;--muted:#A9B4C4;--line:#2A3858;--soft:#1B2A4B;--g:#5FD39A;--gbg:rgba(95,211,154,.14);--r:#FF8A80;--rbg:rgba(255,138,128,.14);--btn:#F4F5F7;--btnink:#14213D}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15}
h2{font-size:1.35rem;margin-bottom:6px}
p{margin:0 0 .7em}
:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:72px}
.logo{height:54px;width:auto;display:block}.logo.neg{display:none;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.cl{display:none}:root:not([data-theme="light"]) .logo.neg{display:block}}
:root[data-theme="dark"] .logo.cl{display:none}:root[data-theme="dark"] .logo.neg{display:block}
.stepn{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:500}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:100%;background:var(--mostaza);transition:width .3s;width:0}
main{padding:24px 0 40px}
.lead{color:var(--muted);margin:8px 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:.92rem;font-weight:500;color:var(--muted);margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f small{font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{font:500 1rem Inter,sans-serif;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-height:48px}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:.95rem;cursor:pointer;background:var(--bg);color:var(--ink);font-weight:500}
.tags input{width:18px;height:18px;accent-color:#14213D}
.slide{display:grid;grid-template-columns:1fr 56px;gap:12px;align-items:center}
.slide b{font-family:Sora,sans-serif;font-size:1.6rem;text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:#F5B700;height:34px}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:400}
.yn{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.yn:first-of-type{border-top:0}
.yn small{display:block;color:var(--muted);font-size:.85rem}
.sw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw button{border:0;background:transparent;color:var(--ink);padding:10px 16px;font:600 .95rem Inter,sans-serif;min-height:44px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}
.act{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.act:first-child{border-top:0;padding-top:0;margin-top:0}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btnink);padding:12px 18px;border-radius:12px;font:600 1rem Inter,sans-serif;min-height:50px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.nav .btn{flex:1}
.legal{font-size:.88rem;color:var(--muted);max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:12px}
.legal p{margin:0 0 .6em}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.msg.err{background:var(--rbg);color:var(--r);font-weight:600}
.msg.ok{background:var(--gbg);color:var(--g);font-weight:600}
.msg.info{background:var(--soft)}
.send{display:grid;gap:10px}
.code{font:500 .78rem ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:110px;overflow:auto;color:var(--muted)}
.hidden{display:none!important}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.95rem}
.sum div:first-child{border-top:0}
.sum b{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<p><strong>2. Finalidades.</strong> a) Prestar los servicios de valoración funcional, readaptación de lesiones y entrenamiento, incluida la elaboración y conservación de su historial de seguimiento. b) Gestionar citas y sesiones y realizar por teléfono, email o mensajería las comunicaciones necesarias, incluido el envío de informes y documentos. c) Gestionar cobros, pagos y facturación. d) Si lo autoriza en este documento: tomar imágenes para el análisis biomecánico, comunicar información a otros profesionales y enviarle comunicaciones comerciales. No se elaborarán perfiles ni se tomarán decisiones automatizadas: los cálculos de la aplicación de valoración son ayudas a la valoración profesional.</p>
<p><strong>3. Datos tratados.</strong> Identificativos y de contacto, de facturación, de salud (lesiones, dolor, antecedentes, informes y pruebas médicas, resultados de tests), hábitos de actividad física y, con su autorización, fotografías y vídeos. Los datos de salud son una categoría especial de datos y se tratan con medidas reforzadas.</p>
<p><strong>4. Legitimación.</strong> Ejecución del contrato de prestación de servicios (art. 6.1.b RGPD). Cumplimiento de obligaciones legales fiscales y contables (art. 6.1.c RGPD). Consentimiento explícito para el tratamiento de datos de salud (arts. 6.1.a y 9.2.a RGPD). Consentimiento para imágenes, comunicación de datos a terceros y comunicaciones comerciales (art. 6.1.a RGPD y art. 21 de la Ley 34/2002, LSSI). Interés legítimo en mejorar la calidad del servicio, siempre respetando sus derechos (art. 6.1.f RGPD). Los consentimientos son voluntarios; el de datos de salud es necesario para poder prestar el servicio.</p>
<p><strong>5. Destinatarios.</strong> Los datos solo los trata la titular y, en su caso, personal autorizado con compromiso de confidencialidad. No se cederán a terceros salvo: obligación legal (Administración tributaria, juzgados y tribunales, autoridades competentes); entidades bancarias para la gestión de cobros; encargados del tratamiento (proveedores tecnológicos de almacenamiento y gestión de la información, asesoría) con contrato conforme al art. 28 RGPD; y profesionales o entidades a los que usted autorice en este documento.</p>
<p><strong>6. Transferencias internacionales.</strong> Algunos proveedores tecnológicos pueden tratar datos fuera del Espacio Económico Europeo. En ese caso solo se hará con las garantías del capítulo V del RGPD (decisión de adecuación, como el Marco de Privacidad de Datos UE-EE. UU., o cláusulas contractuales tipo de la Comisión Europea).</p>
<p><strong>7. Conservación.</strong> Mientras se mantenga la relación de prestación de servicios y no se solicite su supresión. Después, los datos quedarán bloqueados, a disposición solo de las autoridades competentes, durante los plazos de prescripción legal aplicables, y se eliminarán al finalizar estos. Las imágenes se conservarán mientras sean necesarias para el seguimiento o hasta que retire su consentimiento.</p>
<p><strong>8. Seguridad.</strong> Se aplican medidas técnicas y organizativas para garantizar la confidencialidad, integridad y disponibilidad de la información (art. 32 RGPD), con acceso restringido a la responsable.</p>
<p><strong>9. Derechos.</strong> Puede ejercer gratuitamente los derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad, el derecho a no ser objeto de decisiones individuales automatizadas y el derecho a retirar en cualquier momento el consentimiento otorgado, sin que ello afecte a la licitud del tratamiento previo. Puede hacerlo en las vías de contacto indicadas, acreditando su identidad; tiene a su disposición un formulario para ello. Se le responderá en el plazo de un mes, prorrogable dos meses más en casos complejos (art. 12.3 RGPD). Si considera que no se han respetado sus derechos, puede presentar una reclamación ante la Agencia Española de Protección de Datos (C/ Jorge Juan, 6 · 28001 Madrid · www.aepd.es · sede.aepd.es).</p>

function get(p){return p.split('.').reduce((o,k)=>o==null?undefined:o[k],D)}
function set(p,v){const ks=p.split('.');let o=D;ks.slice(0,-1).forEach(k=>{if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k]});o[ks[ks.length-1]]=v;save()}
function F(label,path,o={}){const v=get(path);const hint=o.hint?`<small>${esc(o.hint)}</small>`:'';
 if(o.type==='select')return `<label class="f">${label}${hint}<select data-p="${path}">${o.opts.map(x=>{const [val,t]=Array.isArray(x)?x:[x,x||'Elige una opción'];return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
 if(o.type==='area')return `<label class="f">${label}${hint}<textarea data-p="${path}" placeholder="${esc(o.ph||'')}">${esc(v||'')}</textarea></label>`;
 return `<label class="f">${label}${hint}<input type="${o.type||'text'}" data-p="${path}" value="${esc(v??'')}" placeholder="${esc(o.ph||'')}" ${o.ac?`autocomplete="${o.ac}"`:''} ${o.type==='number'?'inputmode="decimal"':''}></label>`}
function slider(label,path,lo,hi){const v=get(path);return `<div class="f">${label}<div class="slide"><input type="range" min="0" max="10" step="1" data-p="${path}" data-num="1" value="${v??0}" aria-label="${esc(label)}"><b data-show="${path}">${v==null?'–':v}</b></div><div class="scale"><span>${lo}</span><span>${hi}</span></div></div>`}
function chips(path,items){return `<div class="tags">${items.map(([k,t])=>`<label><input type="checkbox" data-p="${path}.${k}" ${get(path+'.'+k)?'checked':''}>${esc(t)}</label>`).join('')}</div>`}

 {t:'Actividad',r:()=>`<h2>Actividad física y descanso</h2><div class="card"><div id="acts">${D.iv.act.map((a,i)=>`<div class="act">

  <div class="card"><div class="two">${F('Horas de sueño','iv.sleep',{type:'number'})}${F('¿Cómo descansas?','iv.rest',{type:'select',opts:[['','Elige una opción'],'Buena','Regular','Mala']})}</div>

  ${PARQ.map((q,i)=>{const v=D.iv.parq['q'+i];return `<div class="yn"><span>${esc(q[0])}${q[1]?`<small>${esc(q[1])}</small>`:''}</span><span class="sw"><button type="button" data-yn="iv.parq.q${i}:no" aria-pressed="${v==='no'}">No</button><button type="button" data-yn="iv.parq.q${i}:si" aria-pressed="${v==='si'}">Sí</button></span></div>`}).join('')}</div>`},

 {t:'Protección de datos',r:()=>`<h2>Protección de datos</h2><p class="lead">Léelo y elige qué autorizas. La firma la haremos en la consulta.</p>

 {t:'Enviar',r:()=>{const miss=missing();return `<h2>Enviar el formulario</h2>
  ${miss.length?`<div class="msg err">Falta: ${esc(miss.join(', '))}.</div>`:'<div class="msg ok">Todo listo para enviar.</div>'}
  <div class="card sum">${[['Nombre',[D.c.name,D.c.surname].filter(Boolean).join(' ')],['Teléfono',D.c.phone],['Motivo',L.MOTIVOS.filter(([k])=>D.iv.reasons[k]).map(x=>x[1]).join(', ')],['Dolor ahora',D.iv.painNow!=null?D.iv.painNow+'/10':''],['Objetivo',D.goal]].map(([a,b])=>`<div><span>${a}</span><b>${esc(b||'—')}</b></div>`).join('')}</div>
  <div class="send ${miss.length?'hidden':''}" id="send"><a class="btn" id="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a><a class="btn ghost" id="mail" target="_blank" rel="noopener">Enviar por email</a><button class="btn ghost" type="button" id="copy">Copiar para pegarlo donde quieras</button>
  <p class="lead" style="margin:6px 0 0;font-size:.88rem">Se envía como un código con tus respuestas. Mándalo sin cambiar nada.</p><div class="code" id="codebox">Preparando…</div></div>

function missing(){const m=[];if(!D.c.name)m.push('nombre');if(!D.c.surname)m.push('apellidos');if(!D.c.phone&&!D.c.email)m.push('teléfono o email');if(PARQ.some((_,i)=>!D.iv.parq['q'+i]))m.push('preguntas de salud (paso 7)');if(CONS.some(([k])=>!D.cons[k]))m.push('opciones de protección de datos (paso 9)');return m}

function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const FKEYS=['name','surname','dni','birth','sex','email','phone','address','profession','activityLevel','activity','origin','dx','injDate','side','reasons','motivo','mech','evol','prevInj','surg','treat','patol','med','docsNote','loc','painNow','painMax','tipo','ritmo','irr','agg','eas','calma','act','sleep','rest','minCasa','dias','parq','beliefs','yel','contexto','t','h','c','s','a','v','d','i','g','p','k'];
const FKM={};FKEYS.forEach((k,i)=>FKM[k]=String(i));
function fMap(o,dir){if(Array.isArray(o))return o.map(x=>fMap(x,dir));if(o&&typeof o==='object'){const r={};Object.entries(o).forEach(([k,v])=>{const nk=dir?(FKM[k]!=null?FKM[k]:k):(/^\d+$/.test(k)&&FKEYS[+k]!=null?FKEYS[+k]:k);r[nk]=fMap(v,dir)});return r}return o}
function prune(o){if(Array.isArray(o)){const a=o.map(prune).filter(x=>x!==undefined);return a.length?a:undefined}if(o&&typeof o==='object'){const r={};Object.entries(o).forEach(([k,v])=>{const p=prune(v);if(p!==undefined)r[k]=p});return Object.keys(r).length?r:undefined}if(o===''||o==null||o===false)return undefined;return o}
async function pack(){
  const iv=D.iv,ix=(list,v)=>{const i=list.indexOf(v);return i>0?i:undefined};
  const on=o=>Object.keys(o||{}).filter(k=>o[k]);
  const c=Object.assign({},D.c,{origin:ix(L.ORIG,D.c.origin)});
  const i=Object.assign({},iv,{ritmo:ix(L.RITMO,iv.ritmo),calma:ix(L.CALMA,iv.calma),tipo:on(iv.tipo).map(t=>L.TIPO.indexOf(t)).filter(x=>x>=0),reasons:on(iv.reasons),yel:on(iv.yel),
    parq:PARQ.map((_,n)=>iv.parq['q'+n]==='si'?'s':iv.parq['q'+n]==='no'?'n':'-').join(''),act:(iv.act||[]).filter(a=>a&&a.t)});
  const out=prune({d:today(),c,i,g:D.goal,p:D.psfs.filter(x=>x&&x.a),k:CONS.map(([k])=>D.cons[k]==='si'?'s':D.cons[k]==='no'?'n':'-').join('')});
  const json=JSON.stringify(fMap(out,true));
  try{if('CompressionStream' in window){const st=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'PRV2:'+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(e){}
  return 'PRV3:'+b64u(new TextEncoder().encode(json));
}
function render(){
  const st=STEPS[D.step];const app=document.getElementById('app');
  app.innerHTML=st.r()+`<div class="nav">${D.step>0?'<button class="btn ghost" type="button" id="prev">Atrás</button>':''}${D.step<STEPS.length-1?`<button class="btn" type="button" id="next">${D.step===0?'Empezar':'Siguiente'}</button>`:''}</div>`;
  document.getElementById('stepn').textContent=D.step?`Paso ${D.step} de ${STEPS.length-1} · ${st.t}`:'';
  document.getElementById('prog').style.width=(D.step/(STEPS.length-1)*100)+'%';
  app.querySelectorAll('[data-p]').forEach(el=>{const ev=el.tagName==='SELECT'||el.type==='checkbox'||el.type==='date'?'change':'input';el.addEventListener(ev,()=>{let v=el.type==='checkbox'?el.checked:el.dataset.num?+el.value:el.value;set(el.dataset.p,v);const sh=app.querySelector(`[data-show="${el.dataset.p}"]`);if(sh)sh.textContent=v})});
  app.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{const [p,v]=b.dataset.yn.split(':');set(p,v);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const pv=document.getElementById('prev');if(pv)pv.onclick=()=>go(-1);
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>go(1);
  const aa=document.getElementById('addact');if(aa)aa.onclick=()=>{D.iv.act.push({});save();render()};
  app.querySelectorAll('[data-delact]').forEach(b=>b.onclick=()=>{D.iv.act.splice(+b.dataset.delact,1);save();render()});
  const wp=document.getElementById('wipe');if(wp)wp.onclick=()=>{if(!confirm('¿Borrar tus respuestas de este dispositivo? Hazlo solo si ya me las has enviado.'))return;try{localStorage.removeItem(KEY)}catch(e){}D={c:{},iv:{reasons:{},tipo:{},parq:{},yel:{},act:[{}]},cons:{},psfs:[{a:'',v:null},{a:'',v:null},{a:'',v:null}],step:0};render()};
  if(D.step===STEPS.length-1&&!missing().length)prepareSend();
}
async function prepareSend(){
  const code=await pack();const name=[D.c.name,D.c.surname].filter(Boolean).join(' ');
  const text=`Formulario de ${name}:\n${code}`;
  document.getElementById('codebox').textContent=code;
  document.getElementById('wa').href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(text);
  document.getElementById('mail').href='mailto:'+EMAIL+'?subject='+encodeURIComponent('Formulario de valoración · '+name)+'&body='+encodeURIComponent(text);
  document.getElementById('copy').onclick=async()=>{const b=document.getElementById('copy');try{await navigator.clipboard.writeText(text);b.textContent='Copiado ✓'}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='Copiado ✓'}catch(_){b.textContent='Selecciona el código y cópialo'}ta.remove()}};
}
function go(d){D.step=Math.max(0,Math.min(STEPS.length-1,D.step+d));save();render();window.scrollTo(0,0)}
if(D.step>=STEPS.length)D.step=0;
render();
})();
</script>
